<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>就活リスタートAI — 感情整理から再挑戦まで</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Plus Jakarta Sans"', 'monospace'],
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pop-card': 'popCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'pulse-subtle': 'pulseSubtle 2s infinite ease-in-out',
            'shimmer': 'shimmer 2s infinite linear',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 },
            },
            slideUp: {
              '0%': { opacity: 0, transform: 'translateY(12px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            popCard: {
              '0%': { opacity: 0, transform: 'scale(0.93) translateY(14px)' },
              '100%': { opacity: 1, transform: 'scale(1) translateY(0)' },
            },
            pulseSubtle: {
              '0%, 100%': { transform: 'scale(1)', opacity: 0.95 },
              '50%': { transform: 'scale(1.03)', opacity: 1 },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

    /* iPhone Frame Styling on Desktop */
    @media (min-width: 640px) {
      .mobile-device-frame {
        width: 416px;
        height: 870px;
        max-height: calc(100vh - 16px);
        border-radius: 46px;
        box-shadow: 
          0 0 0 10px #1e293b,
          0 0 0 12px #334155,
          0 25px 60px -15px rgba(0, 0, 0, 0.65),
          0 0 60px rgba(99, 102, 241, 0.15);
      }
    }

    /* Chat bubble tail */
    .bubble-ai { border-radius: 18px 18px 18px 4px; }
    .bubble-user { border-radius: 18px 18px 4px 18px; }

    /* Dynamic Transitions */
    .theme-transition {
      transition: background-color 0.5s ease, border-color 0.5s ease, color 0.3s ease;
    }

    /* Typing Bounce */
    .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Selected trigger animation */
    .chip-selected-animate {
      transform: scale(0.96);
      background-color: #ea580c !important;
      color: #ffffff !important;
      border-color: #c2410c !important;
      transition: all 0.25s ease-out;
    }

    /* Shimmer effect on active highlight */
    .evidence-tag {
      background: linear-gradient(90deg, #fef3c7 0%, #ffedd5 50%, #fef3c7 100%);
      background-size: 200% 100%;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 antialiased min-h-screen flex items-center justify-center p-0 sm:p-2 select-none">

  <!-- Desktop Ambient Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none hidden sm:block">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-sky-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Mobile Screen App Container -->
  <div id="appRoot" class="mobile-device-frame relative w-full h-[100dvh] sm:h-[870px] bg-[#FAF8F5] theme-transition flex flex-col overflow-hidden shadow-2xl">
    
    <!-- Dynamic Island / Speaker notch (visible on desktop) -->
    <div class="hidden sm:flex absolute top-3 left-1/2 -translate-x-1/2 w-28 h-5 bg-slate-900 rounded-full z-50 items-center justify-end px-3">
      <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700"></div>
    </div>

    <!-- ─── HEADER ─────────────────────────────────────────────────────────── -->
    <header id="appHeader" class="pt-3 sm:pt-9 pb-2 px-3 bg-white/90 backdrop-blur-md border-b border-orange-100/80 theme-transition shrink-0 z-40">
      
      <!-- Top Row: App Title & Action Buttons -->
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <!-- App Status Avatar -->
          <div id="statusAvatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white shadow-sm shadow-orange-300/50 shrink-0">
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <h1 class="text-xs sm:text-sm font-bold text-slate-800 tracking-tight">就活リスタートAI</h1>
              <span id="phaseBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 whitespace-nowrap">
                ① 感情受容
              </span>
            </div>
            <p id="headerSubtitle" class="text-[10px] sm:text-[11px] text-slate-500 font-medium">絶望を受け止め、心をゆっくり休める</p>
          </div>
        </div>

        <!-- Header Buttons -->
        <div class="flex items-center space-x-1 shrink-0">
          <!-- Auto Demo Toggle Button (Play / Pause) -->
          <button id="btnAutoDemo" title="フルストーリーを自動実演" class="flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-amber-900 bg-amber-100 hover:bg-amber-200 border border-amber-300 transition active:scale-95 shadow-xs">
            <svg id="demoIcon" class="w-3 h-3 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="demoBtnText">デモ再生</span>
          </button>

          <!-- Reset Chat Button -->
          <button id="btnReset" title="最初からやり直す" class="flex items-center space-x-0.5 px-2 py-1 rounded-full text-[11px] font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 transition active:scale-95">
            <svg class="w-3 h-3 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
            <span>リセット</span>
          </button>
        </div>
      </div>

      <!-- Point 1: Scenario Switcher Tabs (Pattern A vs Pattern B) -->
      <div class="mb-2 p-1 bg-slate-100/90 rounded-xl flex items-center gap-1 border border-slate-200/60">
        <button id="btnScenarioA" onclick="switchScenario('A')" class="flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 bg-white text-orange-700 shadow-xs border border-orange-200">
          <span>🚨 パターンA: 第一志望・最終落ち</span>
          <span class="text-[9px] font-normal text-rose-600 hidden sm:inline">(明後日B社面接)</span>
        </button>
        <button id="btnScenarioB" onclick="switchScenario('B')" class="flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 text-slate-600 hover:text-slate-800">
          <span>☕ パターンB: 滑り止め・ES落ち</span>
          <span class="text-[9px] font-normal text-slate-400 hidden sm:inline">(1週間余裕)</span>
        </button>
      </div>

      <!-- Phase Progress Bar (3 Steps: ①感情受容 ➔ ②状況整理 ➔ ③再行動支援) -->
      <div class="grid grid-cols-3 gap-1 px-0.5">
        <!-- Step 1 -->
        <button onclick="setPhase(1)" id="stepTab-1" class="group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center bg-orange-50 border border-orange-300 text-orange-700 shadow-xs">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span id="tabBadge-1" class="w-3.5 h-3.5 rounded-full bg-orange-500 text-white flex items-center justify-center text-[9px]">1</span>
            <span>感情受容</span>
          </div>
          <span class="text-[9px] text-orange-600/90 font-normal">絶望の傾聴・受容</span>
        </button>

        <!-- Step 2 -->
        <button onclick="setPhase(2)" id="stepTab-2" class="group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center bg-slate-50 border border-slate-200 text-slate-400 hover:bg-slate-100">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span id="tabBadge-2" class="w-3.5 h-3.5 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[9px]">2</span>
            <span>状況整理</span>
          </div>
          <span class="text-[9px] text-slate-400 font-normal">直近トリアージ・敗因</span>
        </button>

        <!-- Step 3 -->
        <button onclick="setPhase(3)" id="stepTab-3" class="group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center bg-slate-50 border border-slate-200 text-slate-400 hover:bg-slate-100">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span id="tabBadge-3" class="w-3.5 h-3.5 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[9px]">3</span>
            <span>再行動支援</span>
          </div>
          <span class="text-[9px] text-slate-400 font-normal">直近対策・求人推薦</span>
        </button>
      </div>

      <!-- Rest Mode Banner (Hidden by default, shown during rest landing) -->
      <div id="restModeBanner" class="hidden mt-2 p-2 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
        <div class="flex items-center justify-center space-x-1 text-emerald-800 text-[11px] font-bold">
          <span>🌿</span>
          <span>休養モード適用中（低負荷着地）</span>
        </div>
        <p class="text-[10px] text-emerald-700 mt-0.5">画面を閉じて体を休めよう。いつでも「リセット」でやり直せます。</p>
      </div>
    </header>

    <!-- ─── CHAT MESSAGES AREA ────────────────────────────────────────────── -->
    <main id="chatScrollArea" class="flex-1 overflow-y-auto px-3 py-3.5 space-y-3.5 text-sm scroll-smooth">
      <!-- Chat items inserted dynamically via JS -->
    </main>

    <!-- ─── QUICK REPLIES / TRIAGE SELECTION BAR ───────────────────────────── -->
    <div id="quickReplyBar" class="px-3 py-2 bg-white/85 backdrop-blur-sm border-t border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0 theme-transition">
      <!-- Quick chips injected via JS based on Phase & Context -->
    </div>

    <!-- ─── INPUT AREA ─────────────────────────────────────────────────────── -->
    <footer id="appFooter" class="p-2.5 sm:p-3 bg-white/95 backdrop-blur-md border-t border-slate-200/80 theme-transition shrink-0 z-30 pb-3">
      <form id="chatForm" class="flex items-center gap-2 relative" onsubmit="event.preventDefault(); handleSend();">
        
        <!-- Voice Input Mic Button -->
        <button type="button" id="btnMic" title="声で気持ちを話す" class="flex items-center space-x-1 px-3 py-2 rounded-2xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition shrink-0 active:scale-95">
          <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
          <span class="text-[11px]">音声</span>
        </button>

        <!-- Text Input -->
        <div class="relative flex-1">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="今は無理に前を向かなくて大丈夫。悔しさを吐き出してね"
            autocomplete="off"
            class="w-full py-2.5 pl-3 pr-3 text-xs sm:text-sm bg-slate-100 text-slate-800 placeholder-slate-400 rounded-2xl border border-transparent focus:border-orange-300 focus:bg-white focus:outline-none transition shadow-inner"
          />
        </div>

        <!-- Send Button -->
        <button type="submit" id="btnSend" class="flex items-center space-x-1 px-3.5 py-2.5 rounded-2xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs shadow-md shadow-orange-300 transition shrink-0 active:scale-95 disabled:opacity-50">
          <span>送信</span>
          <svg class="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <!-- ─── JAVASCRIPT LOGIC ──────────────────────────────────────────────── -->
  <script>
    /* ───────────────────────────────────────────────────────────────────────
     * INLINED SVG ICONS
     * ─────────────────────────────────────────────────────────────────────── */
    const ICONS = {
      sparklesSm: `<svg class="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>`,
    };

    /* ───────────────────────────────────────────────────────────────────────
     * 3. 宣言的会話ステップデータ定義
     * ─────────────────────────────────────────────────────────────────────── */
    
    // ▼ ここにステップを追加すると、パターンAの会話を増やせます
    const patternASteps = [
      {
        id: "a-01",
        phase: 1,
        sender: "ai",
        badge: { text: "① 感情受容：否定せず受け止める", className: "bg-orange-100 text-orange-700 border border-orange-200" },
        text: "お疲れさまでした……。\nずっと心血を注ぎ、何ヶ月も準備を重ねてきた【第一志望】の企業。\nその【最終面接（役員面接）】まで死力を尽くして進んだあとの、不採用（お祈り）通知……。\n\nメールを開いた瞬間、心臓を強くえぐられたような衝撃と、目の前が真っ暗になる絶望感に襲われたよね。\n\n今は前なんて1ミリも向かなくていいし、反省なんて絶対にしないで。\n部屋のカーテンを閉め切って、ベッドから起き上がれなくなっているその悔しさ、悲しさ、そのままここに吐き出してね。私は最後まであなたの味方だからね。",
        delay: 1000
      },
      {
        id: "a-02",
        phase: 1,
        sender: "user",
        text: "もう就活やめたい…第一志望だったのに最終面接で落ちて、自分の全人格も、大学4年間頑張ってきたすべてを否定されたみたいで涙が止まらない…もうどうでもいい、何もやりたくない",
        delay: 2000
      },
      {
        id: "a-03",
        phase: 1,
        sender: "ai",
        badge: { text: "🧡 メンタルケア：深い自責と絶望感を受容", className: "bg-rose-100 text-rose-700 border border-rose-200" },
        text: "【絶対にあなたが悪いんじゃないよ】\n「4年間のすべてを否定された」「もうどうでもいい、何もやりたくない」……そう思ってしまうの、本当に無理もないよ。\n\n高校を卒業してからの大学4年間、サークルもバイトも勉強も、全部この第一志望に入りたい一心で積み重ねてきたんだもんね。\n\nそれがたった1通のお祈りメールで突き返されたら、これまでの人生や自分の存在そのものを否定されたように感じるのが当たり前だよ。\n今は何もやりたくなくていい。部屋に引きこもっていていい。その絶望を、無理にポジティブに変えようとしなくていいんだよ。",
        delay: 2400
      },
      {
        id: "a-04",
        phase: 1,
        sender: "user",
        text: "親や周りの友達にもずっと受かる風に言ってたから、落ちたなんて恥ずかしくて誰にも言えない…あんなに準備した自分が情けなくて、ただ部屋で毛布かぶって震えてる",
        delay: 2200
      },
      {
        id: "a-05",
        phase: 1,
        sender: "ai",
        badge: { text: "🍵 ペース確認（ワンクッション）", className: "bg-amber-100 text-amber-800 border border-amber-200" },
        text: "誰にも言えなくて、たった一人で毛布にくるまって震えていたんだね……。その孤独と悔しさ、痛いほどわかるよ。\n\n明後日にはB社の面接も控えているけれど、今はまだ心臓がバクバクして気持ちが追いつかないよね。\n\n急かすつもりは一切ないよ。まだ気持ちが追いついていないなら、もう少しこのまま受け止めるよ。もしほんの少しだけ整理できそうなら、明後日のB社に向けて無理のない範囲で一緒に見ていこうか？\nあなたのペースで選んでね。",
        delay: 2400,
        choices: [
          {
            label: "🧭 少し吐き出せたから、明後日のB社に向けて整理したい",
            text: "少しだけ気持ちを吐き出せたかも。明後日にB社の面接もあるから、何がダメだったのか無理のない範囲で整理したい",
            action: "continue",
            nextStepId: "a-06"
          },
          {
            label: "🛌 今日はもう何もしたくないから泥のように休みたい",
            text: "今日はもう何もしたくないから、画面を閉じて泥のように休むよ…",
            action: "休養",
            nextStepId: "a-rest"
          }
        ]
      },
      // 休養・低負荷着地ステップ
      {
        id: "a-rest",
        phase: 1,
        sender: "ai",
        badge: { text: "🌿 休養モード：低負荷着地", className: "bg-emerald-100 text-emerald-800 border border-emerald-200" },
        text: "無理しないでね。今日は画面を閉じて、少しでも体を休めよう。\n今はエネルギーを充電することが最優先だよ。明日のことやB社の面接も、休んでからで大丈夫。\n\nまた動きたくなったらいつでも話しかけてね。いつでも待っているよ。",
        delay: 1500,
        isRestLanding: true
      },
      // Phase 2：状況整理・トリアージ
      {
        id: "a-06",

        badge: { text: "⚡ 直近タスク・緊急トリアージ", className: "bg-blue-100 text-blue-700 border border-blue-200" },

        delay: 2200
      },
      {
        id: "a-07",
        phase: 2,
        sender: "user",
        text: "最終面接まで通過していたES（ガクチカ）を見てもらいたい。カフェでの新人離職率を下げるためにマニュアルを作って教育したエピソードなんだけど、どこかおかしかったのかな？",
        delay: 2200
      },
      {
        id: "a-08",
        phase: 2,
        sender: "ai",
        text: "「カフェでの新人離職率を下げるマニュアル作成と教育」、これは何百人もの応募者の中から役員面接まで残った素晴らしい強みだよ！あなたの主体性と人を巻き込む行動力は本物だね。\n\nでは、あの緊迫した役員面接の場で、役員から「何を聞かれ、どこで詰まってしまったのか」を教えてくれるかな？",
        delay: 2200
      },
      {
        id: "a-09",
        phase: 2,
        sender: "user",
        text: "役員面接で「うちの企業理念の何に共感し、泥臭く体現できるか？」と深掘りされたとき、形式的なことしか言えず詰まってしまった…現場の課題解決プロセスを語るべきだったのかな",
        delay: 2200
      },
      // Phase 3：再行動支援（失敗構造化メモ ＆ モジュール3カード）
      {
        id: "a-10",

      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    function scrollChatToElement(el) {
      const chatArea = document.getElementById('chatScrollArea');
      if (!chatArea) return;
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
      }
    }

      const text = input.value.trim();
      if (!text || STATE.isWaitingAi) return;
      input.value = '';
      sendUserMessage(text);
    }

    async function sendUserMessage(text) {
      appendMessage('user', text);
      STATE.isWaitingAi = true;
      showTypingIndicator();

      await new Promise(r => setTimeout(r, 700 + Math.random() * 300));
      removeTypingIndicator();

      const steps = STATE.scenario === 'A' ? patternASteps : patternBSteps;
      
      // 休養判定
      if (text.includes('泥のように休') || text.includes('息抜きして明日から')) {
        const restStep = steps.find(s => s.id.includes('rest'));
        if (restStep) {
          appendMessage('ai', restStep.text, false, restStep.badge);
          enterRestMode();
          STATE.isWaitingAi = false;
          return;
        }
      }

      // Check if user text matches an existing step text
      const matchedIdx = steps.findIndex(s => s.sender === 'user' && s.text.trim() === text.trim());
      if (matchedIdx !== -1 && matchedIdx + 1 < steps.length) {
        const nextAiStep = steps[matchedIdx + 1];
        if (nextAiStep.sender === 'ai') {
          if (nextAiStep.phase !== STATE.phase) {
            setPhase(nextAiStep.phase, false);
          }
          appendMessage('ai', nextAiStep.text, false, nextAiStep.badge);
          if (nextAiStep.choices) {
            renderInlineChoices(nextAiStep.choices);
          }
          if (nextAiStep.card) {
            renderCardByStep(nextAiStep.card);
          }
          STATE.isWaitingAi = false;
          updateQuickChips();
          return;
        }
      }

      // Default fallback response
      let reply = '気持ちを教えてくれてありがとう。一歩ずつ、あなたのペースで整理していこうね。';
      let badge = null;

      if (STATE.phase === 1) {
        if (text.includes('4年間') || text.includes('否定') || text.includes('やめたい')) {
          badge = { text: '🧡 メンタルケア：深い自責と絶望感を受容', className: 'bg-rose-100 text-rose-700 border border-rose-200' };
          reply = '【絶対にあなたが悪いんじゃないよ】\n4年間のすべてを否定されたように感じるの、本当に無理もないよ。今は前なんて向かなくていい。その悔しさと絶望を、ここにそのまま吐き出してね。';
        } else {
          // ワンクッションペース確認へ促す
          const step05 = steps.find(s => s.choices);
          if (step05) {
            appendMessage('ai', step05.text, false, step05.badge);
            renderInlineChoices(step05.choices);
            STATE.isWaitingAi = false;
            updateQuickChips();
            return;
          }
        }
      } else if (STATE.phase === 2) {
        if (text.includes('カフェ') || text.includes('ES') || text.includes('ガクチカ')) {
          reply = '「カフェでの新人離職率を下げるマニュアル作成」、素晴らしいガクチカだよ！役員面接でどこに詰まってしまったと感じたか教えてくれる？';
        } else if (text.includes('理念') || text.includes('逆質問') || text.includes('詰まった')) {
          setPhase(3, false);
          const lastStep = steps[steps.length - 1];
          appendMessage('ai', lastStep.text, false, lastStep.badge);
          renderCardByStep(lastStep.card);
          STATE.isWaitingAi = false;
          updateQuickChips();
          return;
        }
      }

      appendMessage('ai', reply, false, badge);
      STATE.isWaitingAi = false;
      updateQuickChips();
    }

    function handleChoiceClick(choice) {
      if (choice.action === '休養') {
        appendMessage('user', choice.text);
        setTimeout(() => {

          const restStep = steps.find(s => s.id.includes('rest'));
          if (restStep) {
            appendMessage('ai', restStep.text, false, restStep.badge);

          enterRestMode();

      } else {

          setPhase(2, false);

          const target = steps.find(s => s.id === choice.nextStepId) || steps.find(s => s.phase === 2 && s.sender === 'ai');

    function toggleAutoDemo() {

    function pauseAutoDemo() {
      STATE.isDemoPlaying = false;
      clearTimeout(STATE.demoTimer);
      const btn = document.getElementById('btnAutoDemo');
      const text = document.getElementById('demoBtnText');
      const icon = document.getElementById('demoIcon');
      if (btn) {
        text.textContent = '再開';
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';

    function stopAutoDemo() {
      STATE.isDemoPlaying = false;
      clearTimeout(STATE.demoTimer);
      const btn = document.getElementById('btnAutoDemo');
      const text = document.getElementById('demoBtnText');
      const icon = document.getElementById('demoIcon');
      if (btn) {
        text.textContent = 'デモ再生';
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        btn.className = 'flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-amber-900 bg-amber-100 hover:bg-amber-200 border border-amber-300 transition active:scale-95 shadow-xs';
      }

    async function startAutoDemo() {
      STATE.isDemoPlaying = true;
      exitRestMode();

      const btn = document.getElementById('btnAutoDemo');
      const text = document.getElementById('demoBtnText');
      const icon = document.getElementById('demoIcon');
      if (btn) {
        text.textContent = '一時停止';
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        btn.className = 'flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-white bg-amber-600 hover:bg-amber-700 border border-amber-600 transition active:scale-95 shadow-xs';
      }

      resetAll(false);

      const steps = STATE.scenario === 'A' ? patternASteps : patternBSteps;
      
      for (let i = 0; i < steps.length; i++) {
        if (!STATE.isDemoPlaying) break;
        const step = steps[i];

        // 休養ステップは通常のフルデモ再生ではスキップ（整理して再行動するフローを実演）
        if (step.isRestLanding) continue;

        // フェーズ変更がある場合
        if (step.phase !== STATE.phase) {
          setPhase(step.phase, false);
        }

        // 表示ウェイト
        await waitDemo(step.delay || 1500);
        if (!STATE.isDemoPlaying) break;

        if (step.sender === 'user') {
          appendMessage('user', step.text);
        } else {
          appendMessage('ai', step.text, false, step.badge);
        }

        // 選択肢がある場合
        if (step.choices && step.choices.length > 0) {
          renderInlineChoices(step.choices);
          await waitDemo(1800);
          if (!STATE.isDemoPlaying) break;

          // 自動デモでは「前を向いて整理する」側の選択肢をクリックシミュレート
          const choiceBtn = document.getElementById('choice_btn_0');
          if (choiceBtn) {
            choiceBtn.click();
            await waitDemo(800);
          }
        }

        // カード描画がある場合
        if (step.card) {
          renderCardByStep(step.card);
          await waitDemo(1200);
        }
      }

      await waitDemo(800);
      stopAutoDemo();
    }

    function waitDemo(ms) {
      return new Promise((resolve) => {
        STATE.demoTimer = setTimeout(resolve, ms);
      });
    }

      ];
      const randomText = demoVoiceTexts[Math.floor(Math.random() * demoVoiceTexts.length)];
      
      const input = document.getElementById('messageInput');
      input.value = '';
      let i = 0;
      const timer = setInterval(() => {
        if (i < randomText.length) {
          input.value += randomText[i];
          i++;
        } else {
          clearInterval(timer);
        }
      }, 35);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    /* ───────────────────────────────────────────────────────────────────────
     * MOCK INTERVIEW SIMULATION (inline chat)
     * ─────────────────────────────────────────────────────────────────────── */
    async function startMockInterview() {
      const btn = document.getElementById('btnStartMockInterview');
      if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = '⏳ シミュレーション中…'; }

      appendMessage('ai', '【🎯 面接シミュレーション開始】\n推薦企業C社（自律分散型組織）の面接を想定した模擬問答を始めるよ！\n前回の「理念深掘りで詰まった反省」を活かして答えてみてね。');

      await new Promise(r => setTimeout(r, 1600));

      appendMessage('ai', '【👔 C社 採用担当（面接官）】\n「さっそくですが、カフェのアルバイトで新人離職率を下げるマニュアルを作成された経験について伺いました。\n\n弊社は現場裁量を重視する文化ですが、その経験を、弊社の環境でどのように活かせると思いますか？」');

      await new Promise(r => setTimeout(r, 1000));

      const chatArea = document.getElementById('chatScrollArea');
      const choiceWrapper = document.createElement('div');
      choiceWrapper.className = 'flex flex-col gap-2 my-3 animate-pop-card';
      choiceWrapper.id = 'mockInterviewChoices';

      const choices = [
        { label: '💡 弱み反転回答（推奨・発言根拠連動）', text: '前回の面接では形式的な理念共感にとどまってしまいましたが、カフェの現場で学んだのは「マニュアルを起点にして、一人ひとりの声を聞きながら柔軟に改善し続けること」の重要性でした。現場裁量を重視する御社であれば、この「現場に寄り添いながら仕組みを育てる力」をダイレクトに活かせると考えています。', isPrimary: true },
        { label: '📋 標準回答', text: 'カフェで新人教育マニュアルを作成し、離職率を下げた経験があります。この経験を御社でも活かし、チームの成長に貢献したいと考えています。', isPrimary: false }
      ];

      choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = choice.isPrimary
          ? 'w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-900 font-bold text-xs shadow-md transition active:scale-95 text-left'
          : 'w-full py-2.5 px-4 rounded-xl bg-white/80 text-slate-700 font-bold text-xs border border-slate-200 shadow-xs transition active:scale-95 text-left';
        btn.innerHTML = `<span class="block font-extrabold mb-1">${choice.label}</span><span class="block text-[10.5px] font-normal leading-relaxed">${choice.text.substring(0, 60)}…</span>`;
        btn.onclick = () => {
          choiceWrapper.remove();
          handleMockAnswer(choice, idx);
        };
        choiceWrapper.appendChild(btn);
      });

      chatArea.appendChild(choiceWrapper);
      scrollChatToElement(choiceWrapper);
    }

    async function handleMockAnswer(choice, idx) {
      appendMessage('user', choice.text);
      await new Promise(r => setTimeout(r, 1400));

      if (idx === 0) {
        appendMessage('ai', '【👔 C社 採用担当（面接官）】\n「なるほど、"マニュアルを起点にして現場に寄り添い改善し続ける"という視点、非常に素晴らしいですね。\n\n形式的な理念の暗唱ではなく、実際の現場行動と結びついていて説得力があります。ぜひ次の選考でも詳しくお話を聞かせてください。」');
      } else {
        appendMessage('ai', '【👔 C社 採用担当（面接官）】\n「ありがとうございます。マニュアル作成の経験は素晴らしいですね。\n\nもう少し具体的に、現場でどんな壁にぶつかり、どう寄り添って乗り越えたのか聞かせていただけますか？」');
      }

      await new Promise(r => setTimeout(r, 1000));
      renderInterviewFeedbackCard(idx);
    }

    function renderInterviewFeedbackCard(answerIdx) {
      const chatArea = document.getElementById('chatScrollArea');
      const card = document.createElement('div');
      card.className = 'w-full my-3 p-4 bg-gradient-to-br from-violet-600 via-purple-700 to-indigo-900 text-white rounded-2xl shadow-xl animate-pop-card space-y-3';

      const score = answerIdx === 0 ? 98 : 72;
      const scoreColor = answerIdx === 0 ? 'text-yellow-300' : 'text-orange-300';
      const evaluation = answerIdx === 0
        ? `<li><strong>前回の敗因「形式的な理念回答」</strong>を見事に<span class="text-yellow-300">「現場寄り添い型の泥臭い具体回答」</span>へ反転できています！</li>
           <li>カフェでのマニュアル改善経験を、C社の「現場裁量カルチャー」と自然に紐づけています。</li>
           <li>明後日のB社面接でもこの構成を使えば、理念質問で詰まる心配はありません！</li>`
        : `<li>エピソードの提示はできていますが、<strong>「具体的な困難と泥臭い乗り越え方」</strong>が不足しています。</li>
           <li>前回の反省点である「形式的な回答」からの脱却がまだ十分ではありません。</li>
           <li>次回はカフェでの新人教育の生々しい葛藤を1行入れると格段に良くなります。</li>`;

      card.innerHTML = `
        <div class="flex items-center justify-between border-b border-purple-400/40 pb-2">
          <div class="flex items-center space-x-1.5 font-extrabold text-xs text-yellow-200">
            <span class="text-sm">📊</span>
            <span>面接シミュレーション 重点フィードバック（根拠紐づけ）</span>
          </div>
          <span class="text-[9px] font-bold bg-yellow-400 text-slate-900 px-2 py-0.5 rounded-full">講評カード</span>
        </div>

        <div class="text-center py-2">
          <div class="text-[10px] text-purple-200 font-bold">弱み克服度</div>
          <div class="text-4xl font-black ${scoreColor}" style="text-shadow: 0 0 20px rgba(255,255,255,0.3);">${score}%</div>
        </div>

        <div class="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/20 space-y-1.5">
          <div class="font-bold text-xs text-purple-200">【詳細評価と根拠】：</div>
          <ul class="list-disc pl-4 space-y-1 text-[10.5px] text-purple-50 leading-relaxed">
            ${evaluation}
          </ul>
        </div>

        <div class="text-center text-[10px] text-purple-200 pt-1">
          ${answerIdx === 0 ? '🎉 前回の失敗を完全克服！明後日のB社面接にも自信を持って臨もう！' : '💪 もう一度弱み反転回答にチャレンジしてみよう！'}
        </div>
      `;

      chatArea.appendChild(card);
      scrollChatToElement(card);
    }

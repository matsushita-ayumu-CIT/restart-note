<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>就活リスタートAI — 感情整理から再挑戦まで</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Plus Jakarta Sans"', 'monospace'],
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-subtle': 'pulseSubtle 2s infinite ease-in-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 },
            },
            slideUp: {
              '0%': { opacity: 0, transform: 'translateY(10px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            pulseSubtle: {
              '0%, 100%': { transform: 'scale(1)', opacity: 0.95 },
              '50%': { transform: 'scale(1.03)', opacity: 1 },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

    /* iPhone Frame Styling on Desktop */
    @media (min-width: 640px) {
      .mobile-device-frame {
        width: 410px;
        height: 854px;
        max-height: calc(100vh - 18px);
        border-radius: 46px;
        box-shadow: 
          0 0 0 10px #1e293b,
          0 0 0 12px #334155,
          0 25px 60px -15px rgba(0, 0, 0, 0.65),
          0 0 60px rgba(99, 102, 241, 0.15);
      }
    }

    /* Chat bubble tail */
    .bubble-ai { border-radius: 18px 18px 18px 4px; }
    .bubble-user { border-radius: 18px 18px 4px 18px; }

    /* Dynamic Transitions */
    .theme-transition {
      transition: background-color 0.5s ease, border-color 0.5s ease, color 0.3s ease;
    }

    /* Typing Bounce */
    .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 antialiased min-h-screen flex items-center justify-center p-0 sm:p-2 select-none">

  <!-- Desktop Ambient Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none hidden sm:block">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-sky-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Mobile Screen App Container -->
  <div id="appRoot" class="mobile-device-frame relative w-full h-[100dvh] sm:h-[854px] bg-[#FAF8F5] theme-transition flex flex-col overflow-hidden shadow-2xl">
    
    <!-- Dynamic Island / Speaker notch (visible on desktop) -->
    <div class="hidden sm:flex absolute top-3 left-1/2 -translate-x-1/2 w-28 h-5 bg-slate-900 rounded-full z-50 items-center justify-end px-3">
      <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700"></div>
    </div>

    <!-- ─── HEADER ─────────────────────────────────────────────────────────── -->
    <header id="appHeader" class="pt-3 sm:pt-9 pb-2.5 px-3.5 bg-white/85 backdrop-blur-md border-b border-orange-100/80 theme-transition shrink-0 z-40">
      
      <!-- Top Row: App Title & Action Buttons -->
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <!-- App Status Avatar -->
          <div id="statusAvatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white shadow-sm shadow-orange-300/50 shrink-0">
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <h1 class="text-xs sm:text-sm font-bold text-slate-800 tracking-tight">就活リスタートAI</h1>
              <span id="phaseBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 whitespace-nowrap">
                ① 感情受容
              </span>
            </div>
            <p id="headerSubtitle" class="text-[10px] sm:text-[11px] text-slate-500 font-medium">悔しさを吐き出して心を整える</p>
          </div>
        </div>

        <!-- Header Buttons -->
        <div class="flex items-center space-x-1 shrink-0">
          <!-- Auto Demo Button -->
          <button id="btnAutoDemo" title="フルストーリーを自動実演" class="flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-amber-800 bg-amber-100/90 hover:bg-amber-200 border border-amber-300 transition active:scale-95 shadow-xs">
            <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>デモ再生</span>
          </button>

          <!-- Reset Chat Button -->
          <button id="btnReset" title="最初からやり直す" class="flex items-center space-x-0.5 px-2 py-1 rounded-full text-[11px] font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 transition active:scale-95">
            <svg class="w-3 h-3 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
            <span>リセット</span>
          </button>

          <!-- API & Debug Settings Button -->
          <button id="btnSettings" title="設定" class="flex items-center space-x-0.5 p-1.5 rounded-full text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 transition active:scale-95">
            <svg class="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Phase Progress Bar (3 Steps: ①感情受容 ➔ ②状況整理 ➔ ③再行動支援) -->
      <div class="grid grid-cols-3 gap-1 px-0.5">
        <!-- Step 1 -->
        <button onclick="setPhase(1)" id="stepTab-1" class="group flex flex-col items-center py-1.5 px-1 rounded-xl transition-all duration-300 text-center bg-orange-50 border border-orange-300 text-orange-700 shadow-xs">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span class="w-3.5 h-3.5 rounded-full bg-orange-500 text-white flex items-center justify-center text-[9px]">1</span>
            <span>感情受容</span>
          </div>
          <span class="text-[9px] text-orange-600/90 font-normal">絶望の傾聴・受容</span>
        </button>

        <!-- Step 2 -->
        <button onclick="setPhase(2)" id="stepTab-2" class="group flex flex-col items-center py-1.5 px-1 rounded-xl transition-all duration-300 text-center bg-slate-50 border border-slate-200 text-slate-400 hover:bg-slate-100">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span class="w-3.5 h-3.5 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[9px]">2</span>
            <span>状況整理</span>
          </div>
          <span class="text-[9px] text-slate-400 font-normal">ES深掘・弱点分析</span>
        </button>

        <!-- Step 3 -->
        <button onclick="setPhase(3)" id="stepTab-3" class="group flex flex-col items-center py-1.5 px-1 rounded-xl transition-all duration-300 text-center bg-slate-50 border border-slate-200 text-slate-400 hover:bg-slate-100">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span class="w-3.5 h-3.5 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[9px]">3</span>
            <span>再行動支援</span>
          </div>
          <span class="text-[9px] text-slate-400 font-normal">企業推薦・面接対策</span>
        </button>
      </div>
    </header>

    <!-- ─── CHAT MESSAGES AREA ────────────────────────────────────────────── -->
    <main id="chatScrollArea" class="flex-1 overflow-y-auto px-3 py-3.5 space-y-3.5 text-sm scroll-smooth">
      <!-- Chat items inserted dynamically via JS -->
    </main>

    <!-- ─── QUICK REPLIES / TRIAGE SELECTION BAR ───────────────────────────── -->
    <div id="quickReplyBar" class="px-3 py-2 bg-white/80 backdrop-blur-sm border-t border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0 theme-transition">
      <!-- Quick chips injected via JS based on Phase & Context -->
    </div>

    <!-- ─── INPUT AREA ─────────────────────────────────────────────────────── -->
    <footer id="appFooter" class="p-2.5 sm:p-3 bg-white/95 backdrop-blur-md border-t border-slate-200/80 theme-transition shrink-0 z-30 pb-3">
      <form id="chatForm" class="flex items-center gap-2 relative" onsubmit="event.preventDefault(); handleSend();">
        
        <!-- Voice Input Mic Button -->
        <button type="button" id="btnMic" title="声で気持ちを話す" class="flex items-center space-x-1 px-3 py-2 rounded-2xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition shrink-0 active:scale-95">
          <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
          <span class="text-[11px]">音声</span>
        </button>

        <!-- Text Input -->
        <div class="relative flex-1">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="今は無理に前を向かなくて大丈夫。悔しさを吐き出してね"
            autocomplete="off"
            class="w-full py-2.5 pl-3 pr-3 text-xs sm:text-sm bg-slate-100 text-slate-800 placeholder-slate-400 rounded-2xl border border-transparent focus:border-orange-300 focus:bg-white focus:outline-none transition shadow-inner"
          />
        </div>

        <!-- Send Button -->
        <button type="submit" id="btnSend" class="flex items-center space-x-1 px-3.5 py-2.5 rounded-2xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs shadow-md shadow-orange-300 transition shrink-0 active:scale-95 disabled:opacity-50">
          <span>送信</span>
          <svg class="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>

      <!-- Recording indicator tooltip -->
      <div id="micIndicator" class="hidden mt-2 py-1 px-3 bg-rose-50 border border-rose-200 text-rose-600 text-[11px] rounded-lg items-center justify-between animate-fade-in">
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
          <span class="font-medium">🎤 音声認識中…（声で気持ちを話してみてね）</span>
        </div>
        <button type="button" onclick="stopSpeechRecognition()" class="text-rose-600 font-bold hover:underline text-[10px]">停止</button>
      </div>
    </footer>

    <!-- ─── SETTINGS & DEBUG MODAL ─────────────────────────────────────────── -->
    <div id="settingsModal" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
      <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl space-y-4 border border-slate-100">
        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
          <div class="flex items-center space-x-2">
            <span class="text-base">⚙️</span>
            <h2 class="text-sm font-bold text-slate-800">アプリ設定・デバッグ</h2>
          </div>
          <button onclick="toggleSettingsModal(false)" class="p-1 rounded-full text-slate-400 hover:bg-slate-100">
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Manual Phase Switcher -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">フェーズの手動切替 (動作確認用)</label>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="setPhase(1); toggleSettingsModal(false);" class="py-2 px-1 text-[11px] font-bold rounded-xl bg-orange-50 text-orange-700 border border-orange-200 hover:bg-orange-100 text-center">
              ① 感情受容
            </button>
            <button onclick="setPhase(2); toggleSettingsModal(false);" class="py-2 px-1 text-[11px] font-bold rounded-xl bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 text-center">
              ② 状況整理
            </button>
            <button onclick="setPhase(3); toggleSettingsModal(false);" class="py-2 px-1 text-[11px] font-bold rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 text-center">
              ③ 再行動支援
            </button>
          </div>
        </div>

        <!-- LLM Mode Selection -->
        <div class="space-y-2 pt-2 border-t border-slate-100">
          <label class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">AI応答エンジン</label>
          <select id="aiModeSelect" class="w-full text-xs py-2 px-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 text-slate-700 font-medium">
            <option value="mock">内蔵シナリオモック (APIキー不要・即座に応答)</option>
            <option value="gemini">Google Gemini API (APIキー要)</option>
            <option value="openai">OpenAI API (GPT-4o-mini / APIキー要)</option>
          </select>
        </div>

        <!-- API Key Input -->
        <div id="apiKeySection" class="space-y-1.5 hidden">
          <label class="text-[11px] font-bold text-slate-600">APIキー</label>
          <input 
            type="password" 
            id="apiKeyInput" 
            placeholder="AI Studio または OpenAI のAPIキーを入力"
            class="w-full text-xs py-2 px-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-orange-400 text-slate-700"
          />
          <p class="text-[10px] text-slate-400">※キーはブラウザのローカルメモリにのみ保持され、外部には送信されません。</p>
        </div>

        <div class="pt-2 flex justify-end space-x-2">
          <button onclick="toggleSettingsModal(false)" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition shadow-md">
            設定を保存して閉じる
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- ─── JAVASCRIPT LOGIC ──────────────────────────────────────────────── -->
  <script>
    /* ───────────────────────────────────────────────────────────────────────
     * INLINED SVG ICONS
     * ─────────────────────────────────────────────────────────────────────── */
    const ICONS = {
      sparklesSm: `<svg class="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>`,

        { label: '🚪 なぜ最終でダメだったのか原因を整理したい', text: '少し眠って温かいものを飲んだら、頭のモヤが少し晴れてきたよ…なぜあの第一志望の役員面接で落ちてしまったのか、少しだけ一緒に原因を整理してみてくれる？', action: 'goto_phase2' },
      ],
      phase2: [

    /* ───────────────────────────────────────────────────────────────────────
     * INITIALIZATION
     * ─────────────────────────────────────────────────────────────────────── */
    function initApp() {
      const savedKey = localStorage.getItem('restart_ai_key');
      const savedMode = localStorage.getItem('restart_ai_mode');
      if (savedKey) {
        STATE.apiKey = savedKey;
        const el = document.getElementById('apiKeyInput');
        if (el) el.value = savedKey;
      }
      if (savedMode) {
        STATE.aiMode = savedMode;
        const el = document.getElementById('aiModeSelect');
        if (el) el.value = savedMode;
        if (savedMode !== 'mock') {
          const sec = document.getElementById('apiKeySection');
          if (sec) sec.classList.remove('hidden');
        }
      }

      const aiModeSelect = document.getElementById('aiModeSelect');
      if (aiModeSelect) {
        aiModeSelect.addEventListener('change', (e) => {
          STATE.aiMode = e.target.value;
          localStorage.setItem('restart_ai_mode', e.target.value);
          const sec = document.getElementById('apiKeySection');
          if (sec) {
            if (e.target.value === 'mock') {
              sec.classList.add('hidden');
            } else {
              sec.classList.remove('hidden');
            }
          }
        });
      }

      const apiKeyInput = document.getElementById('apiKeyInput');
      if (apiKeyInput) {
        apiKeyInput.addEventListener('input', (e) => {
          STATE.apiKey = e.target.value.trim();
          localStorage.setItem('restart_ai_key', STATE.apiKey);
        });
      }

      const btnSettings = document.getElementById('btnSettings');
      if (btnSettings) {
        btnSettings.addEventListener('click', () => {
          toggleSettingsModal(true);
        });
      }

      const btnReset = document.getElementById('btnReset');
      if (btnReset) {
        btnReset.addEventListener('click', () => {
          resetAll();
        });
      }

      const btnAutoDemo = document.getElementById('btnAutoDemo');
      if (btnAutoDemo) {
        btnAutoDemo.addEventListener('click', () => {
          runAutoDemoStory();
        });
      }

      const btnMic = document.getElementById('btnMic');
      if (btnMic) {
        btnMic.addEventListener('click', () => {
          toggleSpeechRecognition();
        });
      }

      setPhase(1, false);
      appendMessage(INITIAL_MESSAGES[1].role, INITIAL_MESSAGES[1].text);
      updateQuickChips();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

    /* ───────────────────────────────────────────────────────────────────────
     * PHASE SWITCHING & THEME DYNAMICS
     * ─────────────────────────────────────────────────────────────────────── */
    function setPhase(newPhase, announce = true) {
      STATE.phase = newPhase;
      STATE.turnCountInPhase = 0;
      const theme = THEMES[newPhase];

      const appRoot = document.getElementById('appRoot');
      appRoot.style.backgroundColor = theme.appBg;

      const phaseBadge = document.getElementById('phaseBadge');
      phaseBadge.textContent = theme.badge;
      phaseBadge.className = `text-[10px] font-semibold px-2 py-0.5 rounded-full ${theme.badgeClass}`;
      document.getElementById('headerSubtitle').textContent = theme.subtitle;

      for (let i = 1; i <= 3; i++) {
        const tab = document.getElementById(`stepTab-${i}`);
        if (i === newPhase) {
          tab.className = `group flex flex-col items-center py-1.5 px-1 rounded-xl transition-all duration-300 text-center ${theme.activeTabBg}`;
          tab.querySelector('span:first-child').className = `w-4 h-4 rounded-full ${theme.btnSendBg.split(' ')[0]} text-white flex items-center justify-center text-[10px] font-bold shadow-xs`;
        } else if (i < newPhase) {
          tab.className = `group flex flex-col items-center py-1.5 px-1 rounded-xl transition-all duration-300 text-center bg-white/70 border border-slate-200 text-slate-500`;
          tab.querySelector('span:first-child').className = `w-4 h-4 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] font-bold`;
          tab.querySelector('span:first-child').innerHTML = '✓';
        } else {
          tab.className = `group flex flex-col items-center py-1.5 px-1 rounded-xl transition-all duration-300 text-center ${theme.inactiveTabBg}`;
          tab.querySelector('span:first-child').className = `w-4 h-4 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[10px]`;
          tab.querySelector('span:first-child').innerHTML = i;
        }
      }

      const btnSend = document.getElementById('btnSend');
      btnSend.className = `flex items-center space-x-1 px-3.5 py-2.5 rounded-2xl ${theme.btnSendBg} text-white font-bold text-xs transition shrink-0 active:scale-95 disabled:opacity-50`;

      const avatar = document.getElementById('statusAvatar');
      avatar.className = `w-8 h-8 rounded-full bg-gradient-to-tr ${theme.avatarGrad} flex items-center justify-center text-white shadow-sm shrink-0`;

      document.getElementById('messageInput').placeholder = theme.inputPlaceholder;

      if (announce) {
        if (newPhase === 2) {
          appendMessage('ai', '気持ちをたくさん吐き出してくれて、本当にありがとう。少しずつ心の波が落ち着いてきたね。\n\nここからは【② 状況整理と深掘りカウンセリング】に入ろう。\n落ちた原因はあなたの人間性や能力不足なんかじゃないということを、一つひとつの事実（提出したES・役員面接の問答）から丁寧に解き明かしていこうね。');
        } else if (newPhase === 3) {
          appendMessage('ai', '弱点と本当の強みの言語化、本当にお疲れさまでした！\n\nここからは【③ 再行動支援】のフェーズです。\n整理した「カルチャー不一致」と「あなたの本当の強み」を自動変換し、おすすめの企業検索フィルターと求人、そして役員面接リベンジ対策をお届けするよ！');
          renderCultureToFilterCard();
        }
      }

      updateQuickChips();
    }

    /* ───────────────────────────────────────────────────────────────────────
     * CHAT RENDERING
     * ─────────────────────────────────────────────────────────────────────── */
    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function appendMessage(role, text, isHtml = false, customBadge = null) {
      const chatArea = document.getElementById('chatScrollArea');
      const time = getCurrentTime();
      const theme = THEMES[STATE.phase];

      const wrapper = document.createElement('div');
      wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-slide-up items-end gap-2`;

      if (role === 'ai') {
        const badgeHtml = customBadge ? `<span class="mb-1.5 inline-block text-[9px] font-bold px-2 py-0.5 rounded-full ${customBadge.className}">${customBadge.text}</span><br/>` : '';
        wrapper.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-gradient-to-tr ${theme.avatarGrad} flex items-center justify-center text-white shrink-0 shadow-xs mb-1">
            ${ICONS.sparklesSm}
          </div>
          <div class="max-w-[85%] flex flex-col items-start">
            <div class="bubble-ai px-3.5 py-2.5 ${theme.aiBubbleBg} text-slate-800 leading-relaxed text-xs sm:text-[13px] shadow-xs">
              ${badgeHtml}
              ${isHtml ? text : escapeHtml(text).replace(/\n/g, '<br/>')}
            </div>
            <span class="text-[9px] text-slate-400 mt-0.5 ml-1">${time}</span>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="max-w-[85%] flex flex-col items-end">
            <div class="bubble-user px-3.5 py-2.5 ${theme.userBubbleBg} leading-relaxed text-xs sm:text-[13px] shadow-sm font-medium">
              ${escapeHtml(text).replace(/\n/g, '<br/>')}
            </div>
            <span class="text-[9px] text-slate-400 mt-0.5 mr-1">${time}</span>
          </div>
        `;
      }

      chatArea.appendChild(wrapper);
      chatArea.scrollTop = chatArea.scrollHeight;

      STATE.history.push({ role, text, time });
    }

    function showTypingIndicator() {
      const chatArea = document.getElementById('chatScrollArea');
      const theme = THEMES[STATE.phase];
      const indicator = document.createElement('div');
      indicator.id = 'typingIndicator';
      indicator.className = 'flex justify-start items-center gap-2 animate-fade-in';
      indicator.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr ${theme.avatarGrad} flex items-center justify-center text-white shrink-0">
          ${ICONS.sparklesSm}
        </div>
        <div class="bubble-ai px-4 py-2.5 bg-white border border-slate-100 rounded-2xl flex items-center space-x-1.5 shadow-xs">
          <div class="w-2 h-2 rounded-full bg-slate-400 typing-dot"></div>
          <div class="w-2 h-2 rounded-full bg-slate-400 typing-dot"></div>
          <div class="w-2 h-2 rounded-full bg-slate-400 typing-dot"></div>
        </div>
      `;
      chatArea.appendChild(indicator);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    /* ─── QUICK CHIPS UPDATE ─── */
    function updateQuickChips() {
      const chipBar = document.getElementById('quickReplyBar');
      chipBar.innerHTML = '';

      let chips = [];
      if (STATE.phase === 1) {
        chips = QUICK_CHIPS.phase1;
      } else if (STATE.phase === 2) {
        chips = QUICK_CHIPS.phase2;
      } else if (STATE.phase === 3) {
        chips = QUICK_CHIPS.phase3;
      }

      chips.forEach(chip => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium border transition-all active:scale-95 shadow-xs flex items-center space-x-1 ${
          STATE.phase === 1 
            ? 'bg-orange-50/90 border-orange-200 text-orange-800 hover:bg-orange-100'
            : STATE.phase === 2
            ? 'bg-blue-50/90 border-blue-200 text-blue-800 hover:bg-blue-100'
            : 'bg-emerald-50/90 border-emerald-200 text-emerald-800 hover:bg-emerald-100'
        }`;
        btn.innerHTML = `<span>${chip.label}</span>`;
        btn.onclick = () => {
          if (chip.action === 'goto_phase2') {
            setPhase(2);
          } else if (chip.action === 'goto_phase3') {
            setPhase(3);
          } else {
            sendUserMessage(chip.text);
          }
        };
        chipBar.appendChild(btn);
      });
    }

    /* ───────────────────────────────────────────────────────────────────────
     * USER INTERACTION & DEEP COUNSELING ENGINE
     * ─────────────────────────────────────────────────────────────────────── */
    function handleSend() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || STATE.isWaitingAi) return;
      input.value = '';
      sendUserMessage(text);
    }

    async function sendUserMessage(text) {
      appendMessage('user', text);
      STATE.turnCountInPhase++;
      STATE.isWaitingAi = true;
      showTypingIndicator();

      try {
        let reply = '';
        let badge = null;

        // Self-blame / despair detection
        const isDespairOrSelfBlame = (
          text.includes('4年間') || text.includes('全人格') || text.includes('否定') || 
          text.includes('何もやりたくない') || text.includes('どうでもいい') || text.includes('毛布') || text.includes('情けない')
        );
        if (STATE.phase === 1 && isDespairOrSelfBlame) {
          badge = { text: '🧡 メンタルケア：深い自責と絶望感を受容', className: 'bg-rose-100 text-rose-700 border border-rose-200' };
        }

        await new Promise(r => setTimeout(r, 800 + Math.random() * 400));
        reply = generateMockResponse(text);

        removeTypingIndicator();
        appendMessage('ai', reply, false, badge);

        handlePostResponseEvents(text);

      } catch (err) {
        removeTypingIndicator();
        console.error('Error:', err);
        appendMessage('ai', `⚠️ 応答生成エラーが発生しました。\n\n${generateMockResponse(text)}`);
      } finally {
        STATE.isWaitingAi = false;
        updateQuickChips();
      }
    }

    /* ─── POST-RESPONSE EVENT & RICH CARDS TRIGGER ─── */
    function handlePostResponseEvents(userText) {
      if (STATE.phase === 1 && (userText.includes('毛布') || userText.includes('落ち着いてきた') || STATE.turnCountInPhase >= 3)) {
        setTimeout(() => {
          renderMentalCarePrescriptionCard();
          setTimeout(() => {
            appendMessage('ai', '少しでも心の重荷が降りてきたら、今回の【第一志望・役員面接】で「何が起きていたのか」を一緒に紐解いてみませんか？\n上の【② 状況整理】タブを押すか、下の選択肢から進めます。');
          }, 800);
        }, 600);
      }

      if (STATE.phase === 2) {
        if (userText.includes('ES') || userText.includes('ガクチカ')) {
          setTimeout(() => {
            renderEsDeepDiveCard();
          }, 600);
        } else if (userText.includes('役員') || userText.includes('トップダウン') || userText.includes('手こずった') || userText.includes('固まって')) {
          setTimeout(() => {
            renderWeaknessAndValueCard();
            setTimeout(() => {
              appendMessage('ai', '弱点と本当の強みの因数分解が完了しました！\nこの分析データを使って、あなたを心から歓迎してくれる企業検索フィルターと役員面接武器カードを作る【③ 再行動支援】へ進みましょう！');
            }, 800);
          }, 600);
        }
      }

      if (STATE.phase === 3) {
        if (userText.includes('おすすめ企業') || userText.includes('3社')) {
          setTimeout(() => {
            renderRecommendedCompaniesCard();
          }, 600);
        } else if (userText.includes('武器カード') || userText.includes('リベンジ') || userText.includes('テンプレート')) {
          setTimeout(() => {
            renderInterviewWeaponCard();
          }, 600);

          setTimeout(() => {
            renderInterviewFeedbackCard();
          }, 600);

    /* ─── REALISTIC COUNSELING RESPONSE GENERATOR (ALIGNED WITH PERSONA) ─── */
    function generateMockResponse(userText) {
      if (STATE.phase === 1) {
        if (userText.includes('4年間') || userText.includes('全人格') || userText.includes('何もやりたくない') || userText.includes('どうでもいい')) {
          return '【絶対にあなたが悪いんじゃないよ】\n「4年間のすべてを否定された」「もうどうでもいい、何もやりたくない」……そう思ってしまうの、本当に本当に無理もないよ。\n\n高校を卒業してからの大学4年間、サークルもバイトも勉強も、全部この「第一志望」に入りたい一心で積み重ねてきたんだもんね。\n\nそれがたった1通の定型文メールで突き返されたら、これまでの人生や自分の存在そのものを否定されたように感じるのが当たり前だよ。\n\n今は何もやりたくなくていい。部屋に引きこもってていい。無理に前なんて絶対に向かなくていいんだよ。まずはその絶望を、全部ここに置いていって。';
        }
        if (userText.includes('親') || userText.includes('友達') || userText.includes('毛布') || userText.includes('情けない')) {
          return '誰にも言えなくて、たった一人で毛布にくるまって震えていたんだね……。その孤独と悔しさ、胸が張り裂けそうだよ。\n\nでもね、「情けない」「恥ずかしい」と感じるのは、あなたが誰よりも本気で、誰よりも誠実にこの第一志望に向き合ってきた証拠だよ。適当に受けていたなら、そんなに胸は痛まないはずだから。\n\n親御さんや友達への報告なんて、今は一切後回しでいい。誰にも連絡しなくていいから、まずは深く息を吸って、毛布の中で泣き尽くしてね。';
        }
        if (userText.includes('落ち着いてきた') || userText.includes('鉛') || userText.includes('和らいだ')) {
          return 'いっぱい吐き出して泣けたんだね。涙が出るのは、張り詰めていた心が少しずつ息を取り戻してきたサインだよ。\n\n身体が鉛みたいに重いのは当然。今日まで極限のプレッシャーの中で一人で走り続けてきたんだから。\n今日は「就活生」をやめて、ただの「疲れた一人の人間」として過ごそう。温かいものを飲んで、泥のように眠っていいんだよ。';
        }
        return 'その気持ち、教えてくれてありがとう。第一志望の最終面接という一番過酷な痛みを、私は絶対に軽く扱わないよ。誰にも見せられない弱音、全部ここで受け止めるからね。';
      }

      if (STATE.phase === 2) {
        if (userText.includes('ES') || userText.includes('ガクチカ')) {
          return '最終面接まで通過していたES（ガクチカ）を教えてくれてありがとう！\n「カフェでの新人スタッフ離職率を下げるマニュアル作成」というエピソード、本当に素晴らしいよ。何百人という応募者の中から役員面接の数名にまで残ったのは、あなたの主体性と問題解決力が本物だったからに他ならないよ。\n\nここで1つ、あなたの心の原点をカウンセリングさせてね。\nこのマニュアル作りと指導の中で、あなたが「一番ワクワクした瞬間」や「本当に心からやりがいを感じたこと」は何だった？';

      updateQuickChips();
    }

    /* ─── MODAL CONTROLLER ─── */
    function toggleSettingsModal(show) {
      const modal = document.getElementById('settingsModal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    /* ─── SPEECH RECOGNITION ─── */
    let recognition = null;
    let isRecording = false;

    function toggleSpeechRecognition() {
      if (isRecording) {
        stopSpeechRecognition();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        simulateVoiceInput();
        return;
      }

      try {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.interimResults = true;
        recognition.continuous = false;

        recognition.onstart = () => {
          isRecording = true;
          document.getElementById('micIndicator').classList.remove('hidden');
          document.getElementById('btnMic').classList.add('bg-rose-100', 'text-rose-600', 'border-rose-300');
        };

        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
          }
          document.getElementById('messageInput').value = transcript;
        };

        recognition.onerror = () => { stopSpeechRecognition(); };
        recognition.onend = () => { stopSpeechRecognition(); };
        recognition.start();
      } catch (e) {
        simulateVoiceInput();
      }
    }

    function stopSpeechRecognition() {
      isRecording = false;
      document.getElementById('micIndicator').classList.add('hidden');
      document.getElementById('btnMic').classList.remove('bg-rose-100', 'text-rose-600', 'border-rose-300');
      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }
    }

    function simulateVoiceInput() {
      const demoVoiceTexts = [
        '第一志望の最終面接で落ちて、大学4年間すべてを否定されたみたいで何もやる気が起きない',
        '親にも友達にも言えなくて、ただ部屋で毛布かぶって震えてる…自分が情けない',
        '役員からトップダウンと数字至上主義についてこれるかと詰められて固まってしまった',
      ];
      const randomText = demoVoiceTexts[Math.floor(Math.random() * demoVoiceTexts.length)];
      
      const input = document.getElementById('messageInput');
      input.value = '';
      document.getElementById('micIndicator').classList.remove('hidden');
      
      let i = 0;
      const timer = setInterval(() => {
        if (i < randomText.length) {
          input.value += randomText[i];
          i++;
        } else {
          clearInterval(timer);
          setTimeout(() => {
            document.getElementById('micIndicator').classList.add('hidden');
          }, 400);
        }
      }, 40);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>就活リスタートAI — 感情整理から再挑戦まで</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Plus Jakarta Sans"', 'monospace'],
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'slide-up': 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pop-card': 'popCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'pulse-subtle': 'pulseSubtle 2s infinite ease-in-out',
            'shimmer': 'shimmer 2s infinite linear',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 },
            },
            slideUp: {
              '0%': { opacity: 0, transform: 'translateY(12px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            popCard: {
              '0%': { opacity: 0, transform: 'scale(0.93) translateY(14px)' },
              '100%': { opacity: 1, transform: 'scale(1) translateY(0)' },
            },
            pulseSubtle: {
              '0%, 100%': { transform: 'scale(1)', opacity: 0.95 },
              '50%': { transform: 'scale(1.03)', opacity: 1 },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

    /* iPhone Frame Styling on Desktop */
    @media (min-width: 640px) {
      .mobile-device-frame {
        width: 416px;
        height: 870px;
        max-height: calc(100vh - 16px);
        border-radius: 46px;
        box-shadow: 
          0 0 0 10px #1e293b,
          0 0 0 12px #334155,
          0 25px 60px -15px rgba(0, 0, 0, 0.65),
          0 0 60px rgba(99, 102, 241, 0.15);
      }
    }

    /* Chat bubble tail */
    .bubble-ai { border-radius: 18px 18px 18px 4px; }
    .bubble-user { border-radius: 18px 18px 4px 18px; }

    /* Dynamic Transitions */
    .theme-transition {
      transition: background-color 0.5s ease, border-color 0.5s ease, color 0.3s ease;
    }

    /* Typing Bounce */
    .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Selected trigger animation */
    .chip-selected-animate {
      transform: scale(0.96);
      background-color: #ea580c !important;
      color: #ffffff !important;
      border-color: #c2410c !important;
      transition: all 0.25s ease-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 antialiased min-h-screen flex items-center justify-center p-0 sm:p-2 select-none">

  <!-- Desktop Ambient Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none hidden sm:block">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-sky-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Mobile Screen App Container -->
  <div id="appRoot" class="mobile-device-frame relative w-full h-[100dvh] sm:h-[870px] bg-[#FAF8F5] theme-transition flex flex-col overflow-hidden shadow-2xl">
    
    <!-- Dynamic Island / Speaker notch (visible on desktop) -->
    <div class="hidden sm:flex absolute top-3 left-1/2 -translate-x-1/2 w-28 h-5 bg-slate-900 rounded-full z-50 items-center justify-end px-3">
      <div class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700"></div>
    </div>

    <!-- ─── HEADER ─────────────────────────────────────────────────────────── -->
    <header id="appHeader" class="pt-3 sm:pt-9 pb-2 px-3 bg-white/90 backdrop-blur-md border-b border-orange-100/80 theme-transition shrink-0 z-40">
      
      <!-- Top Row: App Title & Action Buttons -->
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center space-x-2">
          <!-- App Status Avatar -->
          <div id="statusAvatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white shadow-sm shadow-orange-300/50 shrink-0">
            <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <h1 class="text-xs sm:text-sm font-bold text-slate-800 tracking-tight">就活リスタートAI</h1>
              <span id="phaseBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 whitespace-nowrap">
                ① 感情受容
              </span>
            </div>
            <p id="headerSubtitle" class="text-[10px] sm:text-[11px] text-slate-500 font-medium">絶望を受け止め、心をゆっくり休める</p>
          </div>
        </div>

        <!-- Header Buttons -->
        <div class="flex items-center space-x-1 shrink-0">
          <!-- Auto Demo Toggle Button (Play / Pause) -->
          <button id="btnAutoDemo" title="フルストーリーを自動実演" class="flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-amber-900 bg-amber-100 hover:bg-amber-200 border border-amber-300 transition active:scale-95 shadow-xs">
            <svg id="demoIcon" class="w-3 h-3 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="demoBtnText">デモ再生</span>
          </button>

          <!-- Reset Chat Button -->
          <button id="btnReset" title="最初からやり直す" class="flex items-center space-x-0.5 px-2 py-1 rounded-full text-[11px] font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 transition active:scale-95">
            <svg class="w-3 h-3 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
            </svg>
            <span>リセット</span>
          </button>
        </div>
      </div>

      <!-- Point 1: Scenario Switcher Tabs (Pattern A vs Pattern B) -->
      <div class="mb-2 p-1 bg-slate-100/90 rounded-xl flex items-center gap-1 border border-slate-200/60">
        <button id="btnScenarioA" onclick="switchScenario('A')" class="flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 bg-white text-orange-700 shadow-xs border border-orange-200">
          <span>🚨 パターンA: 第一志望・最終落ち</span>
          <span class="text-[9px] font-normal text-rose-600 hidden sm:inline">(直近面接あり)</span>
        </button>
        <button id="btnScenarioB" onclick="switchScenario('B')" class="flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 text-slate-600 hover:text-slate-800">
          <span>☕ パターンB: 滑り止め・ES落ち</span>
          <span class="text-[9px] font-normal text-slate-400 hidden sm:inline">(1週間余裕)</span>
        </button>
      </div>

      <!-- Phase Progress Bar (3 Steps: ①感情受容 ➔ ②状況整理 ➔ ③再行動支援) -->
      <div class="grid grid-cols-3 gap-1 px-0.5">
        <!-- Step 1 -->
        <button onclick="setPhase(1)" id="stepTab-1" class="group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center bg-orange-50 border border-orange-300 text-orange-700 shadow-xs">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span id="tabBadge-1" class="w-3.5 h-3.5 rounded-full bg-orange-500 text-white flex items-center justify-center text-[9px]">1</span>
            <span>感情受容</span>
          </div>
          <span class="text-[9px] text-orange-600/90 font-normal">絶望の傾聴・受容</span>
        </button>

        <!-- Step 2 -->
        <button onclick="setPhase(2)" id="stepTab-2" class="group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center bg-slate-50 border border-slate-200 text-slate-400 hover:bg-slate-100">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span id="tabBadge-2" class="w-3.5 h-3.5 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[9px]">2</span>
            <span>状況整理</span>
          </div>
          <span class="text-[9px] text-slate-400 font-normal">ES深掘・弱点分析</span>
        </button>

        <!-- Step 3 -->
        <button onclick="setPhase(3)" id="stepTab-3" class="group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center bg-slate-50 border border-slate-200 text-slate-400 hover:bg-slate-100">
          <div class="flex items-center space-x-1 text-[11px] font-bold">
            <span id="tabBadge-3" class="w-3.5 h-3.5 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[9px]">3</span>
            <span>再行動支援</span>
          </div>
          <span class="text-[9px] text-slate-400 font-normal">企業推薦・伴走</span>
        </button>
      </div>
    </header>

    <!-- ─── CHAT MESSAGES AREA ────────────────────────────────────────────── -->
    <main id="chatScrollArea" class="flex-1 overflow-y-auto px-3 py-3.5 space-y-3.5 text-sm scroll-smooth">
      <!-- Chat items inserted dynamically via JS -->
    </main>

    <!-- ─── QUICK REPLIES / TRIAGE SELECTION BAR ───────────────────────────── -->
    <div id="quickReplyBar" class="px-3 py-2 bg-white/85 backdrop-blur-sm border-t border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0 theme-transition">
      <!-- Quick chips injected via JS based on Phase & Context -->
    </div>

    <!-- ─── INPUT AREA ─────────────────────────────────────────────────────── -->
    <footer id="appFooter" class="p-2.5 sm:p-3 bg-white/95 backdrop-blur-md border-t border-slate-200/80 theme-transition shrink-0 z-30 pb-3">
      <form id="chatForm" class="flex items-center gap-2 relative" onsubmit="event.preventDefault(); handleSend();">
        
        <!-- Voice Input Mic Button -->
        <button type="button" id="btnMic" title="声で気持ちを話す" class="flex items-center space-x-1 px-3 py-2 rounded-2xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-orange-50 hover:text-orange-600 border border-slate-200 transition shrink-0 active:scale-95">
          <svg class="w-4 h-4 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
          <span class="text-[11px]">音声</span>
        </button>

        <!-- Text Input -->
        <div class="relative flex-1">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="今は無理に前を向かなくて大丈夫。悔しさを吐き出してね"
            autocomplete="off"
            class="w-full py-2.5 pl-3 pr-3 text-xs sm:text-sm bg-slate-100 text-slate-800 placeholder-slate-400 rounded-2xl border border-transparent focus:border-orange-300 focus:bg-white focus:outline-none transition shadow-inner"
          />
        </div>

        <!-- Send Button -->
        <button type="submit" id="btnSend" class="flex items-center space-x-1 px-3.5 py-2.5 rounded-2xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs shadow-md shadow-orange-300 transition shrink-0 active:scale-95 disabled:opacity-50">
          <span>送信</span>
          <svg class="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </footer>

  </div>

  <!-- ─── JAVASCRIPT LOGIC ──────────────────────────────────────────────── -->
  <script>
    /* ───────────────────────────────────────────────────────────────────────
     * INLINED SVG ICONS
     * ─────────────────────────────────────────────────────────────────────── */
    const ICONS = {
      sparklesSm: `<svg class="w-3.5 h-3.5 fill-none stroke-current" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>`,
    };

      A: {
        phase1: [
          { label: '💔 4年間すべて否定された気分…何もしたくない', text: 'もう就活やめたい…第一志望だったのに最終面接で落ちて、自分の全人格も、大学4年間頑張ってきたすべてを否定されたみたいで涙が止まらない…もうどうでもいい、何もやりたくない' },
          { label: '😭 親や友達にも顔向けできない…部屋で震えてる', text: '親や周りの友達にもずっと第一志望って受かる風に言ってたから、落ちたなんて恥ずかしくて誰にも言えない…あんなに準備した自分が情けなくて、ただ部屋で毛布かぶって震えてる' },

          { label: '📊 ES改善チェックリストと推薦求人を見る', text: 'ブラッシュアップされた自己分析と、来週に向けて受けるべきおすすめ求人を教えて！' },

    /* ─── THEME CONFIGURATION ─── */
    const THEMES = {
      1: {
        name: '感情受容',
        badge: '① 感情受容・深い傾聴',

        appBg: '#FAF8F5',

        aiBubbleBg: 'bg-white text-slate-800 border border-blue-100 shadow-xs',

      3: {
        name: '再行動支援',
        badge: '③ 再行動支援・個別伴走',

        appBg: '#F0F9F5',
        activeTabBg: 'bg-emerald-50 border-emerald-300 text-emerald-700 shadow-xs',
        inactiveTabBg: 'bg-slate-50 border-slate-200 text-slate-400',
        badgeClass: 'bg-emerald-100 text-emerald-700',
        avatarGrad: 'from-emerald-500 to-teal-500 shadow-emerald-300/50',
        btnSendBg: 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-300',
        inputPlaceholder: 'おすすめ企業や、次回面接対策の質問をしてみてね',
        userBubbleBg: 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-emerald-200',
        aiBubbleBg: 'bg-white text-slate-800 border border-emerald-100 shadow-xs',
      }
    };

    /* ───────────────────────────────────────────────────────────────────────
     * INITIALIZATION
     * ─────────────────────────────────────────────────────────────────────── */
    function initApp() {
      const btnReset = document.getElementById('btnReset');
      if (btnReset) {
        btnReset.addEventListener('click', () => {
          stopAutoDemo();
          resetAll();
        });
      }

      const btnAutoDemo = document.getElementById('btnAutoDemo');
      if (btnAutoDemo) {
        btnAutoDemo.addEventListener('click', () => {
          toggleAutoDemo();
        });
      }

      const btnMic = document.getElementById('btnMic');
      if (btnMic) {
        btnMic.addEventListener('click', () => {
          simulateVoiceInput();
        });
      }

      setPhase(1, false);
      appendMessage(INITIAL_MESSAGES[STATE.scenario].role, INITIAL_MESSAGES[STATE.scenario].text);
      updateQuickChips();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

    /* ───────────────────────────────────────────────────────────────────────
     * POINT 1: SCENARIO SWITCHING (PATTERN A vs PATTERN B)
     * ─────────────────────────────────────────────────────────────────────── */
    function switchScenario(scenarioKey) {
      if (STATE.scenario === scenarioKey && !STATE.isDemoPlaying) return;
      stopAutoDemo();
      STATE.scenario = scenarioKey;

      const btnA = document.getElementById('btnScenarioA');
      const btnB = document.getElementById('btnScenarioB');

      if (scenarioKey === 'A') {
        btnA.className = 'flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 bg-white text-orange-700 shadow-xs border border-orange-200';
        btnB.className = 'flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 text-slate-600 hover:text-slate-800';
      } else {
        btnB.className = 'flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 bg-white text-blue-700 shadow-xs border border-blue-200';
        btnA.className = 'flex-1 py-1 px-2 rounded-lg text-[10.5px] font-bold transition-all text-center flex items-center justify-center space-x-1 text-slate-600 hover:text-slate-800';
      }

      resetAll();
    }

    /* ───────────────────────────────────────────────────────────────────────
     * PHASE SWITCHING
     * ─────────────────────────────────────────────────────────────────────── */
    function setPhase(newPhase, announce = true) {
      STATE.phase = newPhase;
      STATE.turnCountInPhase = 0;
      const theme = THEMES[newPhase];

      const appRoot = document.getElementById('appRoot');
      appRoot.style.backgroundColor = theme.appBg;

      const phaseBadge = document.getElementById('phaseBadge');
      phaseBadge.textContent = theme.badge;
      phaseBadge.className = `text-[10px] font-semibold px-2 py-0.5 rounded-full ${theme.badgeClass}`;
      document.getElementById('headerSubtitle').textContent = theme.subtitle;

      for (let i = 1; i <= 3; i++) {
        const tab = document.getElementById(`stepTab-${i}`);
        const badge = document.getElementById(`tabBadge-${i}`);
        if (i === newPhase) {
          tab.className = `group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center ${theme.activeTabBg}`;
          badge.className = `w-3.5 h-3.5 rounded-full ${theme.btnSendBg.split(' ')[0]} text-white flex items-center justify-center text-[9px] font-bold shadow-xs`;
          badge.innerHTML = i;
        } else if (i < newPhase) {
          tab.className = `group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center bg-white/70 border border-slate-200 text-slate-500`;
          badge.className = `w-3.5 h-3.5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[9px] font-bold`;
          badge.innerHTML = '✓';
        } else {
          tab.className = `group flex flex-col items-center py-1 px-1 rounded-xl transition-all duration-300 text-center ${theme.inactiveTabBg}`;
          badge.className = `w-3.5 h-3.5 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-[9px]`;
          badge.innerHTML = i;
        }
      }

      const btnSend = document.getElementById('btnSend');
      btnSend.className = `flex items-center space-x-1 px-3.5 py-2.5 rounded-2xl ${theme.btnSendBg} text-white font-bold text-xs transition shrink-0 active:scale-95 disabled:opacity-50`;

      const avatar = document.getElementById('statusAvatar');
      avatar.className = `w-8 h-8 rounded-full bg-gradient-to-tr ${theme.avatarGrad} flex items-center justify-center text-white shadow-sm shrink-0`;

      document.getElementById('messageInput').placeholder = theme.inputPlaceholder;

      if (announce) {
        if (newPhase === 2) {
          if (STATE.scenario === 'A') {
            appendMessage('ai', '気持ちを教えてくれてありがとう。「明後日に別のB社の面接がある」んだね。\nショックの真っ只中に次の面接が重なっている今は、まさに【緊急タスク重複のトリアージ】が必要な局面だよ。\n\n今日は落ち込みすぎず、明後日のB社に向けて「今回の最終面接で何が問われ、どこで詰まってしまったのか」を最小限の負荷でサクッと整理しよう！');
          } else {
            appendMessage('ai', '気持ちを吐き出してくれてありがとう。次の予定まで1週間あるから、落ち着いてじっくり見直せるね。\n\nここからは【② 状況整理・ES分析】に入ろう。落ちたESのエピソードを一緒に振り返って、どこを改善できるか見ていこう！');
          }
        } else if (newPhase === 3) {
          appendMessage('ai', '敗因の言語化と自己分析のアップデート、お見事です！\n\nここからは【③ 再行動支援・個別伴走メニュー】をお届けします。今回の反省を踏まえた「敗因構造化メモ」をリアルタイム生成したよ！');
        }
      }

      updateQuickChips();
    }

    /* ───────────────────────────────────────────────────────────────────────
     * CHAT RENDERING
     * ─────────────────────────────────────────────────────────────────────── */
    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function appendMessage(role, text, isHtml = false, customBadge = null) {
      const chatArea = document.getElementById('chatScrollArea');
      const time = getCurrentTime();
      const theme = THEMES[STATE.phase];

      const wrapper = document.createElement('div');
      wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-slide-up items-end gap-2`;

      if (role === 'ai') {
        const badgeHtml = customBadge ? `<span class="mb-1.5 inline-block text-[9px] font-bold px-2 py-0.5 rounded-full ${customBadge.className}">${customBadge.text}</span><br/>` : '';
        wrapper.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-gradient-to-tr ${theme.avatarGrad} flex items-center justify-center text-white shrink-0 shadow-xs mb-1">
            ${ICONS.sparklesSm}
          </div>
          <div class="max-w-[85%] flex flex-col items-start">
            <div class="bubble-ai px-3.5 py-2.5 ${theme.aiBubbleBg} text-slate-800 leading-relaxed text-xs sm:text-[13px] shadow-xs">
              ${badgeHtml}
              ${isHtml ? text : escapeHtml(text).replace(/\n/g, '<br/>')}
            </div>
            <span class="text-[9px] text-slate-400 mt-0.5 ml-1">${time}</span>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="max-w-[85%] flex flex-col items-end">
            <div class="bubble-user px-3.5 py-2.5 ${theme.userBubbleBg} leading-relaxed text-xs sm:text-[13px] shadow-sm font-medium">
              ${escapeHtml(text).replace(/\n/g, '<br/>')}
            </div>
            <span class="text-[9px] text-slate-400 mt-0.5 mr-1">${time}</span>
          </div>
        `;
      }

      chatArea.appendChild(wrapper);
      chatArea.scrollTop = chatArea.scrollHeight;

      STATE.history.push({ role, text, time });
    }

    function showTypingIndicator() {
      const chatArea = document.getElementById('chatScrollArea');
      const theme = THEMES[STATE.phase];
      const indicator = document.createElement('div');
      indicator.id = 'typingIndicator';
      indicator.className = 'flex justify-start items-center gap-2 animate-fade-in';
      indicator.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr ${theme.avatarGrad} flex items-center justify-center text-white shrink-0">
          ${ICONS.sparklesSm}
        </div>
        <div class="bubble-ai px-4 py-2.5 bg-white border border-slate-100 rounded-2xl flex items-center space-x-1.5 shadow-xs">
          <div class="w-2 h-2 rounded-full bg-slate-400 typing-dot"></div>
          <div class="w-2 h-2 rounded-full bg-slate-400 typing-dot"></div>
          <div class="w-2 h-2 rounded-full bg-slate-400 typing-dot"></div>
        </div>
      `;
      chatArea.appendChild(indicator);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    /* ─── QUICK CHIPS UPDATE ─── */
    function updateQuickChips() {
      const chipBar = document.getElementById('quickReplyBar');
      chipBar.innerHTML = '';

      const currentChips = QUICK_CHIPS[STATE.scenario];
      let chips = [];
      if (STATE.phase === 1) chips = currentChips.phase1;
      else if (STATE.phase === 2) chips = currentChips.phase2;
      else if (STATE.phase === 3) chips = currentChips.phase3;

      chips.forEach(chip => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium border transition-all active:scale-95 shadow-xs flex items-center space-x-1 ${
          STATE.phase === 1 
            ? 'bg-orange-50/90 border-orange-200 text-orange-800 hover:bg-orange-100'
            : STATE.phase === 2
            ? 'bg-blue-50/90 border-blue-200 text-blue-800 hover:bg-blue-100'
            : 'bg-emerald-50/90 border-emerald-200 text-emerald-800 hover:bg-emerald-100'
        }`;
        btn.innerHTML = `<span>${chip.label}</span>`;
        btn.onclick = () => {
          sendUserMessage(chip.text);
        };
        chipBar.appendChild(btn);
      });
    }

    /* ───────────────────────────────────────────────────────────────────────
     * USER INTERACTION & DEEP COUNSELING ENGINE
     * ─────────────────────────────────────────────────────────────────────── */
    function handleSend() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || STATE.isWaitingAi) return;
      input.value = '';
      sendUserMessage(text);
    }

    async function sendUserMessage(text) {
      appendMessage('user', text);
      STATE.turnCountInPhase++;
      STATE.isWaitingAi = true;
      showTypingIndicator();

      try {
        let reply = '';
        let badge = null;

        // Check self-blame detection in Phase 1
        if (STATE.phase === 1 && (text.includes('4年間') || text.includes('全人格') || text.includes('否定') || text.includes('何もやりたくない') || text.includes('どうでもいい'))) {
          badge = { text: '🧡 メンタルケア：深い自責と絶望感を受容', className: 'bg-rose-100 text-rose-700 border border-rose-200' };
        }

        await new Promise(r => setTimeout(r, 700 + Math.random() * 300));
        reply = generateMockResponse(text);

        removeTypingIndicator();
        appendMessage('ai', reply, false, badge);

        handlePostResponseEvents(text);

      } catch (err) {
        removeTypingIndicator();
        console.error('Error:', err);
        appendMessage('ai', `⚠️ 応答生成エラーが発生しました。\n\n${generateMockResponse(text)}`);
      } finally {
        STATE.isWaitingAi = false;
        updateQuickChips();
      }
    }

    /* ─── POINT 2: IN-CHAT TRANSITION TRIGGER CHIPS ─── */
    function renderPhase1TransitionTrigger(containerId, options, selectedCallback) {
      const chatArea = document.getElementById('chatScrollArea');
      const triggerWrapper = document.createElement('div');
      triggerWrapper.id = containerId;
      triggerWrapper.className = 'w-full my-2.5 p-3 bg-white/95 rounded-2xl border border-orange-200 shadow-sm animate-slide-up space-y-2';
      
      triggerWrapper.innerHTML = `
        <div class="flex items-center space-x-1.5 text-orange-800 font-bold text-xs">
          <span>👇</span>
          <span>これからの過ごし方を選んでみよう（あなたのペースでOK）：</span>
        </div>
        <div class="flex flex-col gap-1.5" id="${containerId}_options">
        </div>
      `;

      const optionsContainer = triggerWrapper.querySelector(`#${containerId}_options`);

      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.id = `${containerId}_opt_${idx}`;
        btn.className = `w-full text-left p-2.5 rounded-xl border text-xs font-semibold transition-all flex items-center justify-between ${
          opt.isPrimary 
            ? 'bg-orange-50/90 border-orange-300 text-orange-900 hover:bg-orange-100'
            : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
        }`;
        btn.innerHTML = `
          <span>${opt.label}</span>
          <span class="text-[10px] text-orange-600 font-bold">選択 ➔</span>
        `;
        btn.onclick = () => {
          btn.classList.add('chip-selected-animate');
          setTimeout(() => {
            triggerWrapper.remove();
            selectedCallback(opt);
          }, 350);
        };
        optionsContainer.appendChild(btn);
      });

      chatArea.appendChild(triggerWrapper);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    /* ─── POST-RESPONSE EVENT & RICH CARDS TRIGGER ─── */
    function handlePostResponseEvents(userText) {
      // Phase 1 -> Show Transition Trigger Chip (Point 2)
      if (STATE.phase === 1 && (userText.includes('親') || userText.includes('友達') || userText.includes('毛布') || STATE.turnCountInPhase >= 2)) {
        setTimeout(() => {
          if (STATE.scenario === 'A') {
            appendMessage('ai', '誰にも言えなくて、たった一人で毛布にくるまって震えていたんだね……。その孤独と悔しさ、痛いほどわかるよ。\n少しだけ深呼吸してみようか。今の心の状態に合わせて、これからどう過ごすか一緒に選べるよ。');
            setTimeout(() => {
              renderPhase1TransitionTrigger('p1_trigger_A', [
                { label: '⚡ 少し落ち着いたかも。実は明後日、別のB社の面接がある…', text: '少し落ち着いたかも。実は明後日、別のB社の面接があるんだ…パニックになりそうだからどうすべきか整理したい', isPrimary: true, action: 'triage_B' },
                { label: '🛌 今日はもう何もしたくないから泥のように休みたい', text: '今日はもう何もしたくないから泥のように休むよ', isPrimary: false, action: 'rest' }
              ], (chosen) => {
                sendUserMessage(chosen.text);
                setTimeout(() => setPhase(2), 800);
              });
            }, 600);
          } else {
            appendMessage('ai', '滑り止めと思っていたからこそ、余計にショックだったよね。\nでも次の選考までまだ1週間日数もあるし、焦らなくて大丈夫だよ。どうしたいか教えてね。');
            setTimeout(() => {
              renderPhase1TransitionTrigger('p1_trigger_B', [
                { label: '📄 今回のESのどこがダメだったか客観的に見直したい', text: '今回のESのどこがダメだったか客観的に見直してみたい', isPrimary: true, action: 'review_es' },
                { label: '☕ 今日はとりあえず息抜きして明日からやる', text: '今日はとりあえず息抜きして明日から頑張るよ', isPrimary: false, action: 'rest' }
              ], (chosen) => {
                sendUserMessage(chosen.text);
                setTimeout(() => setPhase(2), 800);
              });
            }, 600);
          }
        }, 500);
      }

      // Phase 2 -> Phase 3 Structure Card Trigger (Point 3 & 4)
      if (STATE.phase === 2 && (userText.includes('理念') || userText.includes('逆質問') || userText.includes('詰まった') || userText.includes('突っ込まれ'))) {
        setTimeout(() => {
          // Transition to Phase 3 with Realtime Pop Animation
          setPhase(3);
          setTimeout(() => {
            renderRealtimeStructureCard();
            setTimeout(() => {
              renderModule3ActionCard();
            }, 1200);
          }, 800);
        }, 700);
      }
    }

    /* ─── REALISTIC COUNSELING RESPONSE GENERATOR ─── */
    function generateMockResponse(userText) {
      if (STATE.phase === 1) {
        if (userText.includes('4年間') || userText.includes('全人格') || userText.includes('何もやりたくない') || userText.includes('どうでもいい')) {
          return '【絶対にあなたが悪いんじゃないよ】\n「4年間のすべてを否定された」「もうどうでもいい、何もやりたくない」……そう思ってしまうの、本当に無理もないよ。\n\n高校を卒業してからの大学4年間、サークルもバイトも勉強も、全部この「第一志望」に入りたい一心で積み重ねてきたんだもんね。\n\nそれがたった1通の冷たいお祈りメールで突き返されたら、これまでの人生や自分の存在そのものを否定されたように感じるのが当たり前だよ。\n今は何もやりたくなくていい。部屋に引きこもっていていい。その絶望を、無理にポジティブに変えようとしなくていいんだよ。';
        }
        if (userText.includes('滑り止め') || userText.includes('自信を失った')) {
          return '滑り止めと思っていた企業だからこそ、「自分はどこにも受からないんじゃないか」って余計に自信を削られてしまうよね……。\nでもね、書類選考の不採用はあなたの能力不足ではなく、単にESの「書き方のフォーカス」が少し企業とズレていただけなんだよ。\n大丈夫。次の予定まで時間はあるから、焦らず立て直していこう。';
        }
        return 'その気持ち、教えてくれてありがとう。悔しさも絶望も、あなたが本気で挑んできた尊い証拠だよ。誰にも言えない弱音、全部ここで受け止めるからね。';
      }

      if (STATE.phase === 2) {
        if (userText.includes('明後日') || userText.includes('B社')) {
          return '【緊急トリアージ判定：直近リカバリー優先】\n明後日にB社の一次面接があるんだね！ショックが残る中で本当にきついタイミングだけど、よく話してくれたね。\n\n第一志望の落ち込みを引きずったまま臨むのは危険だから、まずは今回の第一志望の役員面接で「何が問われ、どこで手こずってしまったのか」を短時間で客観的に整理しよう！';
        }
        if (userText.includes('ES') || userText.includes('ガクチカ')) {
          return '最終面接まで通過していたES（ガクチカ）を教えてくれてありがとう！\n「カフェでの新人離職率を下げるマニュアル作成」というエピソード、本当に素晴らしいよ。何百人という応募者の中から役員面接の数名にまで残ったのは、あなたの主体性が本物だったからに他ならないよ。\n\nでは、あの緊迫した役員面接の場で、役員から「何を聞かれ、どこで詰まってしまったのか」を教えてくれるかな？';
        }
        return '状況を教えてくれてありがとう。一歩ずつ、客観的な事実へと昇華できているよ！';
      }

      if (STATE.phase === 3) {
        return '確実に次への武器が揃ったね！自信を持って次の一歩を踏み出そう！';
      }

      return 'うんうん、その調子で整理していこうね。';
    }

    /* ───────────────────────────────────────────────────────────────────────
     * DEMO PLAYBACK CONTROLLER (PLAY / PAUSE / RESUME)
     * ─────────────────────────────────────────────────────────────────────── */
    function toggleAutoDemo() {
      if (STATE.isDemoPlaying) {
        pauseAutoDemo();
      } else {
        startAutoDemo();
      }
    }

    function pauseAutoDemo() {
      STATE.isDemoPlaying = false;
      clearTimeout(STATE.demoTimer);
      const btn = document.getElementById('btnAutoDemo');
      const text = document.getElementById('demoBtnText');
      const icon = document.getElementById('demoIcon');
      if (btn) {
        text.textContent = '再開';
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        btn.className = 'flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-amber-900 bg-amber-100 hover:bg-amber-200 border border-amber-300 transition active:scale-95 shadow-xs';
      }
    }

    function stopAutoDemo() {
      STATE.isDemoPlaying = false;
      clearTimeout(STATE.demoTimer);
      const btn = document.getElementById('btnAutoDemo');
      const text = document.getElementById('demoBtnText');
      const icon = document.getElementById('demoIcon');
      if (btn) {
        text.textContent = 'デモ再生';
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        btn.className = 'flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-amber-900 bg-amber-100 hover:bg-amber-200 border border-amber-300 transition active:scale-95 shadow-xs';
      }
    }

    async function startAutoDemo() {
      STATE.isDemoPlaying = true;
      const btn = document.getElementById('btnAutoDemo');
      const text = document.getElementById('demoBtnText');
      const icon = document.getElementById('demoIcon');
      if (btn) {
        text.textContent = '一時停止';
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        btn.className = 'flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] font-bold text-white bg-amber-600 hover:bg-amber-700 border border-amber-600 transition active:scale-95 shadow-xs';
      }

      resetAll(false);

      if (STATE.scenario === 'A') {
        // Pattern A: Severe Shock + Imminent Interview
        await waitDemo(500);
        await sendUserMessage('もう就活やめたい…第一志望だったのに最終面接で落ちて、自分の全人格も、大学4年間頑張ってきたすべてを否定されたみたいで涙が止まらない…もうどうでもいい、何もやりたくない');

        await waitDemo(2400);
        await sendUserMessage('親や周りの友達にもずっと受かる風に言ってたから、落ちたなんて恥ずかしくて誰にも言えない…あんなに準備した自分が情けなくて、ただ部屋で毛布かぶって震えてる');

        await waitDemo(2400);
        // Wait for Trigger Button to appear and simulate click
        const optBtn = document.getElementById('p1_trigger_A_opt_0');
        if (optBtn) {
          optBtn.click();
        } else {
          sendUserMessage('少し落ち着いたかも。実は明後日、別のB社の面接があるんだ…パニックになりそうだからどうすべきか整理したい');
          setPhase(2);
        }

        await waitDemo(2400);
        await sendUserMessage('最終面接まで通過していたES（ガクチカ）を見てもらいたい。カフェでの新人離職率を下げるためにマニュアルを作って教育したエピソードなんだけど…');

        await waitDemo(2400);
        await sendUserMessage('役員面接で「うちの企業理念の何に共感し、泥臭く体現できるか？」と深掘りされたとき、形式的なことしか言えず詰まってしまった…現場の課題解決プロセスを語るべきだったのかな');

      } else {
        // Pattern B: Mild Shock + ES Drop + 1 Week Margin
        await waitDemo(500);
        await sendUserMessage('滑り止めの企業だったのに書類で落ちて、自分はどこにも受からないんじゃないかってショックを受けてる…');

        await waitDemo(2400);
        const optBtn = document.getElementById('p1_trigger_B_opt_0');
        if (optBtn) {
          optBtn.click();
        } else {
          sendUserMessage('今回のESのどこがダメだったか客観的に見直してみたい');
          setPhase(2);
        }

        await waitDemo(2400);
        await sendUserMessage('落ちてしまったESの自己PRを見てもらいたい。具体性や再現性が足りなかったのかな？');

        await waitDemo(2400);
        await sendUserMessage('型通りの優等生的な表現になっていた気がする。自分の独自の強みをもっと際立たせたい');
      }

      await waitDemo(1000);
      stopAutoDemo();
    }

    function waitDemo(ms) {
      return new Promise((resolve) => {
        STATE.demoTimer = setTimeout(resolve, ms);
      });
    }

    /* ─── RESET ALL ─── */
    function resetAll(showFirstAi = true) {
      STATE.phase = 1;
      STATE.history = [];
      STATE.turnCountInPhase = 0;
      document.getElementById('chatScrollArea').innerHTML = '';
      setPhase(1, false);
      if (showFirstAi) {
        appendMessage(INITIAL_MESSAGES[STATE.scenario].role, INITIAL_MESSAGES[STATE.scenario].text);
      }
      updateQuickChips();
    }

    /* ─── SPEECH SIMULATION ─── */
    function simulateVoiceInput() {
      const demoVoiceTexts = [
        '第一志望の最終面接で落ちて、大学4年間すべてを否定された気分でもう何もしたくない',
        '明後日に別のB社の面接があるのに全然頭が追いつかなくてパニックになりそう',
        '逆質問で企業理念への深掘りを聞かれたとき、形式的なことしか言えず詰まってしまった',
      ];
      const randomText = demoVoiceTexts[Math.floor(Math.random() * demoVoiceTexts.length)];
      
      const input = document.getElementById('messageInput');
      input.value = '';
      let i = 0;
      const timer = setInterval(() => {
        if (i < randomText.length) {
          input.value += randomText[i];
          i++;
        } else {
          clearInterval(timer);
        }
      }, 35);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>

    /* ── Phase Background Transition ── */
    .phase-bg { transition: background 0.9s cubic-bezier(0.4,0,0.2,1); }

    /* ── Message Entrance ── */
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-in { animation: msgIn 0.32s cubic-bezier(0.4,0,0.2,1) both; }

    /* ── Typing Dots ── */
    @keyframes dotBounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.3; }
      30%           { transform: translateY(-5px); opacity: 1; }
    }
    .tdot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #9CA3AF;
      animation: dotBounce 1.1s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: 0.18s; }
    .tdot:nth-child(3) { animation-delay: 0.36s; }

    /* ── Chip Hover ── */
    .chip { transition: transform 0.13s ease, box-shadow 0.13s ease; cursor: pointer; }
    .chip:hover  { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.13); }
    .chip:active { transform: scale(0.95); }

    /* ── Phone Frame Shadow ── */
    .phone-frame {
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.08),
        0 24px 60px rgba(0,0,0,0.28),
        0 56px 120px rgba(0,0,0,0.14);
    }

    /* ── Scrollbar ── */
    .chat-scroll { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.08) transparent; }
    .chat-scroll::-webkit-scrollbar { width: 3px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

    /* ── Match Bar Transition ── */
    .match-bar { transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }

    .card-1 { animation-delay: 0s; }
    .card-2 { animation-delay: 0.12s; }
    .card-3 { animation-delay: 0.24s; }
  </style>

function detectKeyword(msg) {
  if (/やめ|無理|限界|疲|しんど/.test(msg)) return 'exhausted';
  if (/悔し|くや|怒|むかつ|ムカ/.test(msg)) return 'angry';
  if (/泣|涙|つら|かなし|悲/.test(msg)) return 'sad';
  if (/わからな|何がダメ|理由|なんで|わかんな/.test(msg)) return 'confused';
  if (/恥|みじめ|情けない|恥ずかし/.test(msg)) return 'ashamed';
  if (/親|家族|友達|周り|就活仲間/.test(msg)) return 'social';
  return 'general';
}

/* ── Gemini API call (optional) ── */
async function callGeminiAPI(key, history, sysPrompt) {
  const MODELS = ['gemini-3.8-flash','gemini-2.5-flash','gemini-1.5-flash'];
  for (const model of MODELS) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt > 0) await sleep(attempt * 2000);
      try {
        const res = await fetch(url, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            system_instruction: { parts:[{text: sysPrompt}] },
            contents: history,
            generationConfig: { temperature:0.82, topP:0.9, maxOutputTokens:600 },
          })
        });
        if (res.ok) {
          const d = await res.json();
          return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }
        const err = await res.json().catch(()=>({}));
        const msg = err.error?.message || '';
        if (res.status===404 || /no longer available|not found/.test(msg)) break;
        if (res.status===503 || /high demand|overloaded/.test(msg)) { if(attempt<2) continue; else break; }
        throw new Error(msg);
      } catch(e) { if(attempt<2) continue; break; }
    }
  }
  throw new Error('API接続エラー');
}

    <div className="flex items-start gap-2 mb-4 msg-in">
      {/* Avatar */}

/* ══════════════════════════════════════════════════════
   SYSTEM PROMPTS  (for real Gemini mode)
══════════════════════════════════════════════════════ */
const SYS = {
  1: `あなたは就活AI「就活リスタートAI」のカウンセラーです。フェーズ1「感情受容」として、就活選考で落ちてショックを受けているユーザーの感情をただ受け止めてください。
【絶対禁止】励まし・正論・アドバイス・「次がある」「大丈夫」等の言葉。
【必須】共感・受容・感情の深掘り質問。返答は4文以内。静かで温かいトーン。
2〜3ターン後、ユーザーの気持ちが落ち着いてきたら「少し整理してもいいかな」と自然に促し、メッセージ末尾に <<PHASE:2>> を付ける。`,
  2: `あなたは就活AI「就活リスタートAI」のカウンセラーです。フェーズ2「状況整理」として、以下を順番に確認してください：①志望度、②落ちた選考フェーズ、③直近の予定。一度に1つだけ聞くこと。
データが揃ったら「整理できた。次のステップに進もう」と言い、メッセージ末尾に <<PHASE:3>> を付ける。`,
  3: `あなたは就活AI「就活リスタートAI」のカウンセラーです。フェーズ3「再行動支援」として、今回の敗因を人格否定せず「企業との接点のズレ」として整理し、次の企業選びの軸と面接対策を温かく提示してください。焦らせない。`,
};

/* ══════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════ */
function App() {
  const [phase, setPhase]         = useState(1);
  const [msgs,  setMsgs]          = useState([]);
  const [input, setInput]         = useState('');
  const [loading, setLoading]     = useState(false);
  const [pTurn,  setPTurn]        = useState(0);   // turns within current phase
  const [apiKey, setApiKey]       = useState(() => localStorage.getItem('rn_key') || '');
  const [showSettings, setSettings] = useState(false);
  const [locked, setLocked]       = useState(false); // prevent double send

  // Store phase 2 collected data synchronously (avoid stale closure)
  const p2Data = useRef({ priority:null, stage:null, schedule:null });
  // Store Gemini conversation history (only used in API mode)
  const apiHistory = useRef([]);

  const chatEndRef = useRef(null);
  const taRef      = useRef(null);

  // Auto-scroll
  useEffect(() => {
    setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior:'smooth' }), 60);
  }, [msgs, loading]);

  // Sync desktop background color with phase
  useEffect(() => {
    document.body.style.background = P[phase].bdrop;
  }, [phase]);

  // Initial AI greeting
  useEffect(() => {
    (async () => {
      await sleep(600);
      setLoading(true);
      await sleep(1100);
      setLoading(false);
      pushAI({
        text:"就活、うまくいかなかったんだね。\n\nここでは何も取り繕わなくていい。今感じてること、そのまま話してくれていいよ。",
        chips:["もう就活やめたい…","何がダメだったんだろう","誰にも相談できない","悔しくてたまらない"],
      });
    })();
  }, []);

  /* ── Helpers ── */
  const pushAI   = (data) => setMsgs(prev => [...prev, { id:uid(), role:'ai',   ...data }]);
  const pushUser = (text, atPhase) => setMsgs(prev => [...prev, { id:uid(), role:'user', text, atPhase }]);
  const pushBanner = (from, to) => setMsgs(prev => [...prev, { id:uid(), role:'banner', from, to }]);

  /* ── textarea auto-resize ── */
  const handleInput = e => {
    setInput(e.target.value);
    const ta = taRef.current;
    if (ta) { ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight, 100)+'px'; }
  };

  /* ── Main send logic ── */
  const handleSend = useCallback(async (overrideText) => {
    const text = (overrideText ?? input).trim();
    if (!text || loading || locked) return;
    setInput('');
    if (taRef.current) taRef.current.style.height='auto';
    setLocked(true);

    const curPhase = phase;
    const curTurn  = pTurn;
    pushUser(text, curPhase);

    // ── Gemini API mode ──
    if (apiKey) {
      apiHistory.current.push({ role:'user', parts:[{text}] });
      setLoading(true);
      setLocked(false);
      try {
        const raw = await callGeminiAPI(apiKey, apiHistory.current, SYS[curPhase]);
        // Parse <<PHASE:N>>
        const phM = raw.match(/<<PHASE:(\d)>>/);
        const cleanText = raw.replace(/<<PHASE:\d>>/g,'').trim();
        apiHistory.current.push({ role:'model', parts:[{text: cleanText}] });
        setLoading(false);
        pushAI({ text: cleanText });
        if (phM) {
          const nextPh = parseInt(phM[1]);
          await sleep(1800);
          pushBanner(curPhase, nextPh);
          setPhase(nextPh);
          setPTurn(0);
        } else {
          setPTurn(t => t+1);
        }
      } catch(e) {
        setLoading(false);
        pushAI({ text:'ちょっと待ってて。少ししてからもう一度話しかけてみて。' });
      }
      setLocked(false);
      return;
    }

    // ── Mock mode ──
    setLoading(true);

    if (curPhase === 1) {
      await sleep(1000 + Math.random()*700);
      setLoading(false);

      if (curTurn === 0) {
        // First user msg → empathy
        pushAI({
          text: EMPATHY[detectKeyword(text)],
          chips:["もっと聞いてほしい","なんか涙が出てきた","ほんとにつらかった","誰にも言えなかった"],
        });
        setPTurn(1);
      } else if (curTurn === 1) {
        pushAI({
          text:`うん、ちゃんと聞こえてるよ。\n\nたくさん話してくれてありがとう。全部ちゃんと受け取ってる。\n\nあなたが感じてるしんどさ、ちゃんと伝わってる——それを抱えながら話してくれたこと、それだけで十分すごいことだと思う。\n\n少しだけ、今の状況を一緒に整理してみてもいいかな？前向きになる必要は全然ないから。ただ、あなたの今をちゃんと把握したくて。`,
          chips:["うん、話してみる","もう少し聞いてほしい","整理してみたい"],
        });
        setPTurn(2);
      } else {
        // Turn 2+: gently push to phase 2
        const wantTransition = /うん|整理|話して|いいよ/.test(text);
        pushAI({ text:`うんうん、全部聞いてるよ。\n\n少しだけ、今の状況を一緒に整理してみてもいいかな？`, chips:["うん、いいよ","もう少し待って"] });
        if (wantTransition) {
          await sleep(1700);
          pushBanner(1, 2);
          setPhase(2);
          setPTurn(0);
          await sleep(600);
          setLoading(true);
          await sleep(1100);
          setLoading(false);
          pushAI({ text:"まず聞かせて。今回の企業って、どのくらい行きたかった？", selectType:'priority' });
        } else {
          setPTurn(t => t+1);
        }
      }
      setLocked(false);
      return;
    }

    if (curPhase === 2) {
      await sleep(900 + Math.random()*600);
      setLoading(false);

      if (curTurn === 0) {
        // Priority selected → ask stage
        p2Data.current.priority = text;
        const cmt = PRIORITY_CMT[text] || 'そうか、わかった。';
        pushAI({ text:`${cmt}\n\nどの選考の段階で落ちたか、教えてもらえる？`, selectType:'stage' });
        setPTurn(1);
      } else if (curTurn === 1) {
        // Stage selected → ask schedule
        p2Data.current.stage = text;
        const cmt = STAGE_CMT[text] || 'そっか、ここまで来れたこと自体、すごいことだよ。';
        pushAI({ text:`${cmt}\n\n直近に別の企業の面接や締め切りはある？`, selectType:'schedule' });
        setPTurn(2);
      } else if (curTurn === 2) {
        // Schedule selected → transition prompt
        p2Data.current.schedule = text;
        const cmt = SCHED_CMT[text] || 'そうか。ペースを見ながら一緒に考えていこう。';
        pushAI({
          text:`${cmt}\n\n今から一緒にやりたいのは、「なぜ落ちたのか」を人格否定じゃなくて——企業とあなたの接点がどこにズレてたか、って角度で整理すること。準備できた？`,
          chips:["うん、整理したい","正直まだキツいけど聞く","少し待って"],
        });
        setPTurn(3);
      } else {
        // Turn 3: user responded to transition prompt
        const wantNext = /うん|整理|聞く|進む|はい/.test(text);
        if (wantNext) {
          pushBanner(2, 3);
          setPhase(3);
          setPTurn(0);
          await sleep(700);
          setLoading(true);
          await sleep(1300);
          setLoading(false);
          // Phase 3 auto-chain
          pushAI({
            text:"整理するね。今回の結果を、あなたの「欠点」としてじゃなく、「企業との接点のどこにズレがあったか」として見てみよう。",
            summaryCard: buildSummaryCard(),
          });
          setPTurn(1);
          // Auto-send company cards
          await sleep(2800);
          setLoading(true);
          await sleep(1400);
          setLoading(false);
          pushAI({
            text:"この分析をもとに、次の企業選びのヒントが見えてくるよ。あなたの話を聞いてイメージした企業を挙げるね。",
            companyCards: buildCompanyCards(),
          });
          setPTurn(2);
        } else {
          pushAI({ text:"うん、待てるよ。準備できたらいつでも言って。", chips:["準備できた","もう少し話したい"] });
          setPTurn(t=>t+1);
        }
      }
      setLocked(false);
      return;
    }

    if (curPhase === 3) {
      await sleep(1000 + Math.random()*600);
      setLoading(false);

      if (curTurn === 2) {
        pushAI({
          text:"次の面接に向けて、特に意識してほしいポイントを絞ってみたよ。今すぐじゃなくていい。頭の片隅に置いておいてくれたら。",
          prepCards: buildInterviewPrep(),
        });
        setPTurn(3);
      } else {
        // Open support
        pushAI({
          text:"何か他に気になること、不安に思ってること、話したいことはある？\n\nここにいるから、いつでも話しかけてね。",
          chips:["面接練習がしたい","ES添削してほしい","別の企業の相談","今日はここまでにする"],
        });
        setPTurn(t=>t+1);
      }
      setLocked(false);
      return;
    }

    setLoading(false);
    setLocked(false);
  }, [input, loading, locked, phase, pTurn, apiKey]);

  /* ── Debug: jump to phase ── */
  const debugJump = (p) => {
    setPhase(p); setPTurn(0); setSettings(false);
    setMsgs(prev => [...prev, {id:uid(), role:'banner', from:phase, to:p}]);
    if (p === 2) {
      setTimeout(() => pushAI({text:"まず聞かせて。今回の企業って、どのくらい行きたかった？", selectType:'priority'}), 300);
    } else if (p === 3) {
      setTimeout(() => {
        pushAI({text:"整理するね。今回の結果を、あなたの「欠点」としてじゃなく、「企業との接点のどこにズレがあったか」として見てみよう。", summaryCard:buildSummaryCard()});
      }, 300);
    }
  };

  const ph = P[phase];

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>

      {/* ── Phone Frame ── */}
      <div
        className="phone-frame phase-bg"
        style={{
          width:'100%', maxWidth:393,
          height:'min(812px, 94vh)',
          borderRadius:44,
          overflow:'hidden',
          display:'flex', flexDirection:'column',
          background: ph.bg,
          position:'relative',
        }}
      >
        {/* Status bar */}
        <div style={{display:'flex',justifyContent:'space-between',padding:'13px 24px 0',flexShrink:0}}>
          <span style={{fontSize:11,fontWeight:700,color:'rgba(0,0,0,0.35)'}}>9:41</span>
          <div style={{display:'flex',gap:3,alignItems:'center'}}>
            <span style={{fontSize:9,color:'rgba(0,0,0,0.25)'}}>●●●</span>
          </div>
        </div>

        {/* Header */}
        <div style={{background:ph.hdr,padding:'12px 16px 14px',flexShrink:0,transition:'background 0.8s ease'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:11}}>
            <div>
              <h1 style={{color:'white',fontWeight:900,fontSize:17,letterSpacing:'-0.02em',margin:0}}>就活リスタートAI</h1>
              <p style={{color:'rgba(255,255,255,0.68)',fontSize:10.5,margin:'2px 0 0'}}>{ph.tip.slice(0,22)}…</p>
            </div>
            <button onClick={() => setSettings(true)}
              style={{width:32,height:32,borderRadius:'50%',background:'rgba(255,255,255,0.2)',border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'white'}}>
              <SettingsIcon />
            </button>
          </div>

          {/* Phase progress bar */}
          <div style={{display:'flex',gap:5,alignItems:'center'}}>
            {[1,2,3].map((n,i) => {
              const done   = phase > n;
              const active = phase === n;
              return (
                <React.Fragment key={n}>
                  <div style={{flex:1}}>
                    <div style={{height:3,borderRadius:2,background:'rgba(255,255,255,0.22)',overflow:'hidden',marginBottom:3}}>
                      <div style={{height:'100%',background:'white',borderRadius:2,
                        width: done ? '100%' : active ? '55%' : '0%',
                        transition:'width 0.6s ease'}} />
                    </div>
                    <p style={{fontSize:9,textAlign:'center',
                      color: active ? 'white' : done ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,255,0.35)',
                      fontWeight: active ? 700 : 400, margin:0}}>
                      ①②③[n]— {/* */}{P[n].name}
                    </p>
                  </div>
                  {i<2 && <span style={{color:'rgba(255,255,255,0.3)',fontSize:10,paddingBottom:12}}>›</span>}
                </React.Fragment>
              );
            })}
          </div>
        </div>

        {/* Chat scroll area */}
        <div ref={null} className="chat-scroll" style={{flex:1,overflowY:'auto',padding:'14px 14px 6px'}}>
          {msgs.map(m => {
            if (m.role==='banner') return <PhaseBanner key={m.id} from={m.from} to={m.to} />;
            if (m.role==='ai')     return <AIBubble key={m.id} msg={m} phase={phase} onChipSelect={handleSend} />;
            return <UserBubble key={m.id} msg={m} phase={phase} />;
          })}
          {loading && <TypingBubble phase={phase} />}
          <div ref={chatEndRef} />
        </div>

        {/* Phase tip */}
        <div style={{padding:'3px 16px 5px',textAlign:'center',flexShrink:0}}>
          <p style={{fontSize:10,color:'rgba(0,0,0,0.26)',margin:0}}>{ph.tip}</p>
        </div>

        {/* Input area */}
        <div style={{padding:'8px 12px',paddingBottom:'max(20px, env(safe-area-inset-bottom, 20px))',background:'rgba(255,255,255,0.72)',backdropFilter:'blur(12px)',borderTop:'1px solid rgba(0,0,0,0.07)',flexShrink:0}}>
          {/* Phase 1 quick chips above input */}
          {phase===1 && msgs.length===0 && (
            <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:9}}>
              {["もう就活やめたい…","何がダメだったんだろう","誰にも相談できない","悔しくてたまらない"].map((c,i) => (
                <button key={i} className="chip" onClick={() => handleSend(c)}
                  style={{fontSize:11,padding:'5px 12px',borderRadius:999,background:ph.sel.bg,border:`1px solid ${ph.sel.bdr}`,color:ph.sel.txt}}>
                  {c}
                </button>
              ))}
            </div>
          )}
          <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
            {/* Mic icon button */}
            <button onClick={() => alert('音声入力はChrome / Safari でサポートされています。現在はデモ版のため、テキスト入力をお使いください。')}
              style={{width:36,height:36,borderRadius:'50%',border:`1px solid rgba(0,0,0,0.1)`,background:'white',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,color:'#9CA3AF'}}>
              <MicIcon />
            </button>
            <textarea
              ref={taRef}
              value={input}
              onChange={handleInput}
              onKeyDown={e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); } }}
              placeholder={ph.ph}
              rows={1}
              style={{flex:1,resize:'none',border:'1px solid rgba(0,0,0,0.1)',borderRadius:22,padding:'10px 14px',fontSize:14,color:'#374151',fontFamily:'inherit',outline:'none',lineHeight:'1.45',background:'white',maxHeight:100,scrollbarWidth:'none'}}
            />
            <button
              onClick={() => handleSend()}
              disabled={loading || !input.trim()}
              style={{
                width:40,height:40,borderRadius:'50%',border:'none',
                background: (!loading && input.trim()) ? ph.usr : '#E5E7EB',
                color: (!loading && input.trim()) ? 'white' : '#9CA3AF',
                display:'flex',alignItems:'center',justifyContent:'center',
                cursor: (!loading && input.trim()) ? 'pointer' : 'not-allowed',
                flexShrink:0, transition:'all 0.18s',
                boxShadow: (!loading && input.trim()) ? `0 2px 10px ${ph.usr}60` : 'none',
              }}>
              <SendIcon />
            </button>
          </div>
        </div>
      </div>{/* /phone-frame */}

      {/* Settings Sheet */}
      {showSettings && (
        <SettingsSheet
          onClose={() => setSettings(false)}
          apiKey={apiKey}
          setApiKey={k => { setApiKey(k); localStorage.setItem('rn_key',k); }}
          phase={phase}
          onDebugPhase={debugJump}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
